application:
  name: Batty Joe
  type: browser_arcade_brick_breaker
  version: 1.13.0
  status: active_development_specification
  source_of_truth: true
specification_governance:
  authority: This file is the authoritative Batty Joe product specification for version 1.13.0.
  composition: full_inheritance_with_explicit_change
  inherited_specification: batty-joe-dev-spec-v1.12.0.yaml
  inheritance_rule: All product intent, behaviour, constraints, architecture and acceptance expectations from batty-joe-dev-spec-v1.12.0.yaml are incorporated by reference in full unless explicitly changed below.
  reader_instruction: Read batty-joe-dev-spec-v1.12.0.yaml as the complete inherited product contract, then apply the explicit CHG-0013 changes below.
  change: CHG-0013
physics:
  brick_rebound_zip:
    intent: A brick bounce during ordinary gameplay leaves the ball more energetic (visibly a sharper, faster
      rebound) without producing a lingering or persistent speed boost. This is a stateless, immediate
      collision-response effect, not a second speed-boost system, and stays independent of the existing
      paddle-hit velocity-transfer system and of every frenzy sub-game's own physics.
    mechanism: On any non-penetrating brick collision, after the rebound direction is resolved, the ball's exit
      speed is set to the greater of its incoming speed and a configured zip floor - a minimum energetic
      rebound, never a forced replacement speed. An already-faster ball (for example one still carrying
      legitimate paddle-derived excess speed) is never slowed down by a brick bounce.
    formula: 'zipSpeed = targetSpeed * physics.brickReboundZip.exitSpeedMultiplier; exitSpeed =
      max(incomingSpeed, zipSpeed)'
    observable_displacement: The zip must produce a genuinely faster, sharper-looking rebound in actual ball
      movement, not merely a higher stored velocity value that is set and then discarded before it is ever used
      to move the ball. Because ball movement for a simulation step happens before that step's collision
      resolution, and the ball's speed is otherwise realigned to the ordinary target speed at the start of the
      very next step, the collision response also advances the ball's position immediately by the boosted
      portion of the exit speed alone - (exitSpeed - incomingSpeed) * dt, in the already-resolved outgoing
      direction - rather than by a complete extra movement step at the full exit speed. This keeps the effect
      proportionate to the boost actually applied (zero additional displacement whenever the ball was already
      at or above the zip floor, since there is no boosted portion to move by) and avoids double-advancing the
      ball through distance that ordinary collision detection never sees. This remains a single fixed, stateless
      displacement computed fresh from the current exit velocity every time, not an accumulating or persisted
      effect.
    configuration:
      path: physics.brickReboundZip
      enabled: true
      exitSpeedMultiplier: 1.15
    non_accumulation: The zip floor is computed fresh from the current target speed on every bounce, never from
      a remembered or accumulated value, so repeated consecutive brick bounces cannot ratchet the ball to
      higher and higher speeds. No new persistent field is added to a ball; there is no decay curve. One frame
      after a bounce whose exit speed came solely from the zip floor (no active paddle boost), the ball's speed
      returns to the ordinary target-speed-driven value.
    scope: Applies uniformly to ordinary-play brick collisions only. Paddle-hit velocity transfer and every
      frenzy sub-game's own physics are unaffected and remain independent.
bricks:
  regenerating:
    completion_lock:
      rule: Once every remaining destructible brick on the level is a regenerating brick, regeneration stops -
        an alive heal-mode regenerating brick no longer heals, and a destroyed respawn-mode regenerating brick
        no longer respawns - until a non-regenerating destructible brick is present again.
      remaining_definition: "\"Remaining\" means every brick that is not indestructible and that is still part\
        \ of the level's outcome - alive bricks of any destructible type, plus respawn-mode regenerating bricks\
        \ currently destroyed and awaiting their respawn delay (the only kind of destroyed brick still \"in\
        \ play\"). Indestructible bricks are ignored for this decision."
      applies_to: Ordinary play and frenzy regeneration equally, via one shared rule; not a frenzy-specific or
        ordinary-play-specific exception.
      purpose: Guarantees a level whose only surviving destructible bricks are regenerating-type can always be
        completed, rather than requiring the player to destroy them all within a race against their own
        heal/respawn timers.
frenzy:
  timeout_completion:
    rule: When a frenzy ends (including, but not limited to, timing out) and ordinary state is restored, the
      level is then checked for completion through the existing normal level-completion mechanism - the same
      check already used after any ordinary brick destruction. If frenzy has destroyed every required
      (non-indestructible) brick and only indestructible bricks remain, the level completes; if any ordinary
      required brick survived the frenzy, it does not.
    no_new_rule: There is no separate, frenzy-specific completion rule. Normal frenzy snapshot restoration
      (ball, paddle, power-ups, RNG state, combo, timers) is unaffected and happens exactly as before this
      change; the completion check runs only after that restoration is complete and frenzy has fully ended.
physics_collision:
  resolve_ball_rect_depenetration:
    defect: A ball resolved against a rectangular collider (a brick or the boss) whose previous position could
      not identify a single collision face fell into an ambiguous-approach fallback that reversed the ball's
      velocity without moving it out of the rectangle, allowing the ball to appear to stick or slide along the
      collider's surface for several seconds or indefinitely.
    fix: The fallback now deterministically depenetrates the ball to the minimum-translation boundary of the
      rectangle, plus the same small separation epsilon already used elsewhere in rectangular collision
      resolution, with outgoing velocity directed away from the resolved face - matching the behaviour already
      used when a single collision face can be identified directly.
    scope: A general correction to rectangular ball-collision handling. There is no brick-type-specific or
      boss-specific branching; the fix applies identically to every caller of the shared resolution routine.
non_regression:
  gameplay_unchanged: false
  gameplay_changes:
  - Brick-rebound zip on ordinary-play, non-penetrating brick bounces (physics.brickReboundZip) - see
    physics.brick_rebound_zip above.
  - Regenerating-brick completion lock - heal and respawn are suppressed once every remaining destructible
    brick is regenerating-type - see bricks.regenerating.completion_lock above.
  - Frenzy-timeout level completion via the existing normal completion mechanism when frenzy has destroyed
    every required brick and only indestructibles remain - see frenzy.timeout_completion above.
  physics_unchanged: false
  physics_changes:
  - Brick-rebound zip (see physics.brick_rebound_zip above).
  - resolveBallRect()'s ambiguous-approach fallback now positively depenetrates the ball to the resolved
    boundary instead of only reversing velocity in place - see physics_collision.resolve_ball_rect_depenetration
    above.
  scoring_lives_timing_unchanged: true
  persistence_unchanged: true
  paddle_velocity_transfer_unchanged: true
  frenzy_subgame_physics_unchanged: true
