acceptance_criteria:
- 'A player can start a new seeded campaign on Easy, Normal or Hard and play through procedurally generated levels using keyboard
  controls.

  '
- 'The same seed and difficulty reproduce the same campaign layouts and seeded gameplay randomness on supported browsers.

  '
- 'Paddle/ball gameplay, lives, scoring, combos, power-ups, brick behaviours, level completion, continues, saving, high scores
  and pause/settings operate according to this specification.

  '
- 'Space Invaders Frenzy transforms the remaining brick set into a temporary invader formation, preserves/restores state correctly,
  permits destruction of indestructible bricks, and obeys all specified termination conditions.

  '
- 'Level 20 presents a distinct configurable boss encounter and completing the campaign presents a victory sequence with the
  option of a harder loop.

  '
- 'The game runs without npm, Node, a build process or runtime internet access.

  '
- 'Automated browser tests pass for all required deterministic and rules-based systems.

  '
- 'Generated source files identify Development Specification v1.1.0 in their headers.

  '
- Either Frenzy mode can be activated while any supported normal power-up or supported power-up combination is active without
  hanging, deadlocking, duplicating loops or corrupting restored state.
- Normal power-up timers and suspended normal gameplay timers do not advance during Frenzy transitions or active Frenzy gameplay
  and resume from the correct remaining duration when normal play is restored.
- Space Invaders Frenzy uses extended visual brick-to-alien and alien-to-brick morph transitions with bounded screen shake
  and reduced-motion fallbacks.
- FPS Frenzy provides a pseudo-3D first-person brick field, mouse and keyboard aiming, horizontal strafing, crosshairs, unlimited
  rate-limited hitscan rifle fire, hostile blocks, destruction of indestructible bricks and correct restoration/full-clear
  behaviour.
- Final Assault activates for the configured final fraction/count of required bricks, increases pace and scoring, and applies
  bounded paddle-bounce Hunter Assist after prolonged periods without a required-brick hit.
changelog:
- version: 1.1.0
  date: '2026-08-18'
  changes:
  - Introduces a shared modal Frenzy lifecycle that atomically snapshots, suspends and restores normal gameplay and active
    power-ups.
  - Adds regression requirements covering Frenzy activation with every individual power-up, supported combinations, six-ball
    play, sticky-held balls and same-tick activation races.
  - Extends Frenzy transitions with longer visual morph sequences, stronger bounded screen shake and reduced-motion fallbacks.
  - Adds FPS Frenzy with pseudo-3D extruded bricks, rifle/crosshair gameplay, mouse and keyboard aiming, horizontal strafing,
    hitscan fire and hostile blocks.
  - Makes per-type Frenzy occurrence limits configurable, defaulting to one Space Invaders Frenzy and one FPS Frenzy per level.
  - Adds Final Assault for the last 10 percent of required bricks, with faster play, doubled brick scoring and bounded Hunter
    Assist on delayed paddle bounces.
- version: 1.0.0
  date: '2026-08-18'
  changes:
  - Initial Batty Joe development specification.
  - Defines core Arkanoid-style gameplay and 20-level campaign.
  - Defines deterministic procedural campaign generation using templates, symmetry and controlled randomness.
  - Defines brick, power-up, scoring, combo, continue, save and high-score systems.
  - Defines Space Invaders Frenzy mode.
  - Defines level-20 boss architecture and future milestone boss support.
  - Defines classic arcade presentation, audio, accessibility and attract mode.
  - Defines modular drop-in browser architecture, debugging, testing and spec-driven change governance.
- version: 1.1.1
  date: '2026-08-18'
  changes:
  - Refined FPS Frenzy into a genuine first-person down-the-barrel presentation.
  - Normal paddle is hidden and irrelevant during FPS Frenzy; rifle is a separate first-person weapon entity.
  - Remaining bricks become solid 3D cuboids assigned deterministic varied depths while preserving their recognisable arrangement.
  - Arrow Left/Right now control camera strafing during FPS Frenzy.
  - A/D control horizontal crosshair movement and W/S control vertical crosshair movement; mouse remains full crosshair control.
  - Added FPS depth, occlusion, controls, paddle-hidden and parallax regression tests.
- version: 1.2.0
  date: '2026-08-18'
  changes:
  - Added Pinball Frenzy with two flippers, pinball gravity, transformed targets and drain-based exit.
  - Added Asteroids Frenzy with rotate/thrust ship controls, projectile fire and seeded drifting brick-asteroids.
  - Added Missile Command Frenzy with crosshair-directed interception explosions, hostile missile batteries and player base
    zones.
  - Added Arkanoid Revenge Frenzy with an inverted paddle duel against an enemy paddle built from remaining bricks.
  - Extended the shared Frenzy framework to six data-driven Frenzy modes with independent per-type limits and a configurable
    total-per-level cap.
  - Added paddle-velocity-induced ball spin with deterministic decaying swerve.
  - Added Final Assault stage-3 magnetic assistance after prolonged failure to hit a remaining required brick.
  - Expanded automated and manual tests for all new modes, spin physics, Frenzy restoration and magnetic Final Assault behaviour.
- version: 1.2.1
  date: '2026-08-19'
  changes:
  - Reworked Pinball Frenzy lower playfield to remove the excessively open bottom.
  - Added sloping funnel guide rails that redirect most descending balls toward the flippers.
  - Added two narrow left/right outlanes that intentionally bypass flipper reach and act as fair drain channels.
  - Added inlanes feeding each flipper plus a small central drain gap between the flipper tips.
  - Defined explicit flipper and lower-playfield geometry and added collision/balance regression tests.
- version: 1.2.2
  date: '2026-08-19'
  changes:
  - Rebalanced FPS Frenzy by removing hostile perspective projectiles.
  - Surviving bricks now detach and fall vertically toward the player's world lane as telegraphed hazards.
  - Falling attacks keep a fixed horizontal world trajectory, so strafing changes viewpoint but never makes attacks home or
    curve.
  - Falling bricks can be shot with the FPS hitscan rifle; destroyed attackers remain destroyed and damaged attackers preserve
    damage.
  - Missed falling bricks return to their remembered 3D formation positions after a short recovery.
  - Added deterministic attack-rate, simultaneous-fall limits, telegraphing and regression coverage for FPS falling-brick
    attacks.
- version: 1.2.3
  date: '2026-08-19'
  changes:
  - Changed Final Assault helper reset behaviour to be configuration-driven.
  - 'Default Final Assault helper reset policy is now destroyed_only: ordinary hits no longer reset Hunter Assist or magnetic-assist
    progress.'
  - Added never and any_hit helper reset policies for tuning and backwards comparison.
  - Added developer query-string overrides using cfg.<BattyJoe.Config path>=<value> when debug=true.
  - Query config overrides are validated, session-only, do not mutate static config or persisted settings, and invalidate
    high-score eligibility.
  - Expanded regression tests for helper reset policies and query-string config parsing/validation.
- version: 1.3.0
  date: '2026-08-19'
  changes:
  - Overhauled Final Assault into a continuously escalating end-of-level climax.
  - Final Assault ball speed now ramps continuously from normal speed to +35% over 15 seconds.
  - Final Assault magnetism now ramps visibly up to 30 degrees of steering per second with stronger curved-trail feedback.
  - Added a one-shot Big Bomb powered by a charge bar that fills passively and is accelerated by brick hits, brick destruction
    and high-speed paddle contacts.
  - Big Bomb is activated with ArrowDown when ready and deals exactly 2 damage to every remaining required destructible brick.
  - Big Bomb does not affect indestructible bricks and triggers normal explosive-brick chain reactions.
  - Added developer query overrides for Final Assault speed, magnetism, bomb charge/damage and Pinball Frenzy duration.
  - Increased default Pinball Frenzy duration from 20 seconds to 90 seconds and made it independently configurable.
- version: 1.4.0
  date: '2026-08-19'
  changes:
  - Changed normal brick and screen-edge collisions from perfect mirror reflections to small deterministic imperfect rebounds.
  - Spin now directly modifies brick, screen-edge and paddle rebound angles as well as producing in-flight swerve.
  - Increased moving-paddle contribution to ball spin and increased visible spin curvature.
  - Narrowed Pinball Frenzy left/right outlanes from 46px to 30px and raised the target proportion of contestable downward
    trajectories.
  - Reduced Pinball Frenzy restitution so the ball loses more energy on walls, rails and targets and feels heavier under gravity.
  - Moved Big Bomb ownership from Final Assault to the full level gameplay loop.
  - Big Bomb power now begins charging at level start, can be deployed whenever ready, and remains limited to one use per
    level.
  - Slowed default Big Bomb passive charging to 90 seconds and reduced active hit/destroy/paddle charge bonuses.
  - Added query-config aliases for collision imperfection, spin strength, Pinball restitution/outlane width and level-wide
    Big Bomb charging.
- version: 1.4.1
  date: '2026-08-19'
  changes:
  - Sealed the Pinball Frenzy lower apron so the ball can only be lost through the left outlane, right outlane, or central
    gap between the flippers.
  - Required rendered funnel geometry and collision geometry to match with no hidden gaps beneath or behind the apron.
  - Increased Pinball flipper impulse to compensate for stronger gravity and lower restitution, including stronger outer-tip
    contacts.
  - Changed initial and Sticky Bat ball release so launch angle depends on the ball horizontal position on the bat.
- version: 1.5.0
  date: '2026-08-20'
  changes:
  - Replaced Big Bomb time/hit/destroy/paddle charging with independent Big Bomb Power Up collectibles.
  - Big Bomb Power Ups spawn randomly from an independent seeded level spawner and are never generated by brick destruction.
  - Default Big Bomb readiness now requires collecting 3 Big Bomb Power Ups; required count and spawn cadence are configurable.
  - 'Added 10-Pin Frenzy: first-person 3D bowling view, bricks transform into skittles, default 2 configurable bowls, strike/spare
    scoring and z-axis bowling-ball motion.'
  - Expanded the shared Frenzy framework to eight Frenzy types and added lifecycle, restoration, scoring and deterministic
    tests for both new modes.
pinball_frenzy:
  enabled: true
  trigger: distinct_rare_falling_powerup
  display_name: PINBALL FRENZY
  maximum_occurrences_per_level: from_frenzy_framework_config_default_1
  minimum_suitable_bricks: 6
  lifecycle:
    uses_shared_snapshot_and_restore_contract: true
    normal_powerup_timers_paused: true
    safe_with_all_powerup_combinations: true
  transformation:
    uses_shared_frenzy_framework: true
    enter_seconds: 2.5
    sequence:
    - freeze_and_snapshot_normal_play
    - playfield_tilts_and_gains_pinball_table_depth
    - normal_paddle_splits_and_morphs_into_left_and_right_flippers
    - remaining_bricks_raise_into_pinball_targets_bumpers_and_drop_targets
    - existing_ball_morphs_into_single_frenzy_pinball
    - lanes_lights_and_score_inserts_illuminate
    - unlock_pinball_controls
    exit_seconds: 2.0
    exit_sequence:
    - lock_pinball_controls
    - table_lights_collapse_toward_original_brick_grid
    - surviving_targets_morph_back_to_bricks
    - flippers_merge_back_into_suspended_paddle
    - restore_suspended_normal_gameplay_state
    - unlock_normal_controls
  table:
    flippers: 2
    bottom_drain: true
    side_walls: true
    seeded_bumpers: true
    brick_mapping:
      normal: drop_target
      multi_hit: multi_hit_drop_target
      indestructible: armoured_target_destructible_in_frenzy
      explosive: explosive_bumper
      moving: moving_target
      invisible: shimmer_target
      regenerating: regenerating_drop_target
      powerup: lit_bonus_target
    lower_playfield:
      purpose: Reduce unfair drains by shaping the lower playfield so most descending balls are funnelled into the flipper
        zone while preserving narrow, clearly readable outlane drains.
      reference_playfield:
        width: 960
        height: 720
      apron_start_y: 500
      flipper_zone:
        top_y: 580
        bottom_y: 675
        centre_x: 480
        central_drain_gap_width: 72
        rule: The two flippers must cover the majority of the central funnel exit. A small central drain gap remains between
          their inner tips.
      funnel_guides:
        enabled: true
        left:
          upper_anchor:
          - 120
          - 510
          lower_anchor:
          - 365
          - 625
        right:
          upper_anchor:
          - 840
          - 510
          lower_anchor:
          - 595
          - 625
        collision: solid_pinball_rail
        bounce: restitution_0_76
        purpose: redirect ordinary descending trajectories toward the two flippers
        must_not_create_ball_traps: true
        corners_must_be_rounded: true
        coverage:
          must_join_outer_walls_without_gap: true
          must_join_flipper_apron_without_gap: true
          must_close_entire_lower_screen_except_outlane_entries_and_central_flipper_gap: true
          must_not_allow_ball_to_pass_behind_or_below_funnel_geometry: true
          collision_geometry_must_match_rendered_geometry: true
      outlanes:
        enabled: true
        count: 2
        left:
          x_range:
          - 82
          - 112
          entry_y: 525
          drain_y: 700
        right:
          x_range:
          - 848
          - 878
          entry_y: 525
          drain_y: 700
        width_pixels: 30
        behaviour: Outlanes remain deliberate danger channels but are narrower than v1.3.0. Once a ball is deeply committed
          it remains beyond normal flipper reach and drains.
        visual_readability:
          must_be_clearly_visible: true
          lane_lighting: true
          warning_colour_or_pattern: true
          never_rely_on_colour_alone: true
        entry_rule: A ball may enter an outlane only through its visible upper entrance. The apron and funnel walls prevent
          entry through any hidden lower or side gap.
      inlanes:
        enabled: true
        left:
          feeds: left_flipper
          position: inside_left_outlane
        right:
          feeds: right_flipper
          position: inside_right_outlane
        purpose: provide safe-ish return lanes that feed the outer portion of each flipper
      bottom_boundary:
        sealed_apron: true
        rule: The funnel/apron forms a continuous solid collision boundary across the entire lower playfield. The ball may
          be lost only through the left outlane, the right outlane, or the central gap between the flippers.
        valid_loss_routes:
        - left_outlane
        - right_outlane
        - central_gap_between_flippers
        invalid_loss_routes: none
        lower_screen_edge_is_solid_outside_valid_loss_routes: true
        rendered_geometry_must_match_collision_geometry: true
      difficulty_target:
        ordinary_descent_should_reach_flipper_zone_probability: 0.84
        note: Geometry should make roughly five out of six ordinary downward trajectories contestable by the player. Outlanes
          remain dangerous but should no longer dominate the lower playfield.
    flipper_geometry:
      left:
        pivot:
        - 382
        - 646
        rest_angle_degrees: 18
        active_angle_degrees: -24
        length_pixels: 118
        thickness_pixels: 18
      right:
        pivot:
        - 578
        - 646
        rest_angle_degrees: 162
        active_angle_degrees: 204
        length_pixels: 118
        thickness_pixels: 18
      inner_tip_gap_pixels_at_rest: 72
      must_not_overlap_funnel_guides: true
      must_not_be_able_to_reach_outlanes: true
      power:
        enabled: true
        purpose: Compensate for increased pinball gravity and reduced restitution so flippers can return the ball high into
          the table.
        base_impulse_multiplier: 1.35
        tip_velocity_bonus_multiplier: 1.2
        minimum_upward_exit_speed_multiplier: 1.05
        maximum_upward_exit_speed_multiplier: 1.55
        contact_position_affects_impulse: true
        outer_tip_contacts_are_stronger: true
        held_flipper_does_not_repeatedly_add_energy: true
        energy_is_applied_from_flipper_angular_velocity_at_contact: true
        configurable: true
  ball:
    count: 1
    uses_pinball_gravity: true
    flipper_impulse: true
    retains_frenzy_specific_spin: true
    normal_ball_state_restored_after_frenzy: true
    restitution:
      enabled: true
      purpose: Reduce pinball ping-pong energy and allow gravity to create a heavier, more readable game.
      default: 0.82
      wall: 0.8
      funnel_rail: 0.76
      brick_target: 0.82
      bumper: 0.9
      flipper: 0.88
      maximum_post_collision_speed_multiplier: 1.08
      minimum_speed_multiplier: 0.58
      gravity_restores_downward_momentum: true
      configurable: true
  nudge:
    enabled: true
    small_table_impulse: true
    cooldown_seconds: 1.0
    tilt_penalty: false
  duration:
    maximum_seconds: 90
    ends_on:
    - timer_expiry
    - ball_drains_through_central_gap_or_outlane
    - all_targets_destroyed
    config_key: frenzy.pinball.duration
    query_string_override_example: debug=true&cfg.frenzy.pinball.duration=120
    reason: Pinball Frenzy uses slower gravity-driven play and requires substantially more time than the 20-second action
      Frenzies.
  on_ball_drain:
    terminate_frenzy: true
    lose_normal_life: false
    restore_surviving_bricks: true
    valid_drain_routes:
    - central_gap_between_flippers
    - left_outlane
    - right_outlane
    rule: Pinball Frenzy can end from ball loss only when the ball travels through the left outlane, right outlane, or central
      gap between the flippers. Any other lower-edge loss is a collision defect.
  full_clear:
    completes_level_immediately: true
    bonus_points: 10000
