  storage: localStorage
  autosave: true
  autosave_on_all_significant_state_changes: true
  significant_events_include:
  - level_start
  - level_completion
  - life_loss
  - pause
  - continue_used
  - score_checkpoint
  - powerup_state_change
  - frenzy_start
  - frenzy_end
  - boss_phase_change
  - frenzy_transition_in_start
  - frenzy_transition_out_complete
  - final_assault_start
  save_fields:
  - campaign_seed
  - difficulty
  - current_level
  - score
  - lives
  - continues_remaining
  - generated_level_state
  - settings
  - high_score_eligible_state
  transient_state_policy:
    mid_level_ball_positions_saved: false
    mid_level_paddle_position_saved: false
    on_reload_mid_level: restart_current_level_from_level_start_state
  frenzy_save_policy:
    do_not_persist_half_completed_transition_animation: true
    save_canonical_pre_frenzy_snapshot_and_frenzy_outcome_state: true
    on_reload_during_frenzy_or_transition: restart_current_level_from_level_start_state
audio:
  sound_effects:
    enabled: true
    events:
    - paddle_hit
    - brick_hit
    - brick_break
    - powerup_collect
    - laser
    - explosion
