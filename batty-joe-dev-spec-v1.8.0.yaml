    - ball_count_positions_and_velocities_restore_exactly_when_restoration_is_required
    - sticky_hold_state_restores_exactly
    - paddle_size_and_abilities_restore_exactly
    - combo_and_rng_state_resume_correctly
    - full_clear_transitions_to_level_complete_without_restoring_transient_play_state
performance:
  target: Sustain smooth interactive gameplay on a normal modern desktop browser with six balls, particles, moving bricks,
    either Frenzy mode including pseudo-3D FPS rendering, and Final Assault presentation active where applicable.
  target_fps: 60
  graceful_degradation:
    reduce_particle_density_first: true
    reduce_screen_shake_processing_second: true
    gameplay_simulation_must_not_slow_down: true
    reduce_pseudo_3d_cosmetic_detail_third: true
security_and_storage:
  network_calls_required: false
  personal_data_required: false
  local_storage_only: true
  user_generated_content: false
future_architecture:
  multiplayer:
    planned_possible: true
    current_version: single_player_only
    architecture_requirement: 'Keep input, game-state update and rendering concerns sufficiently separated that future local
      co-op, versus or network synchronization can be added without replacing the core game model.

      '
  handcrafted_levels:
    planned_possible: true
  additional_bosses:
    planned_possible: true
  new_powerups:
    planned_possible: true
  new_brick_types:
    planned_possible: true
