    - fps_block_fire
    - final_assault_start
  music:
    enabled: true
    loop: true
    user_toggle: true
    normal_gameplay_track: true
    separate_frenzy_music: false
    separate_boss_music: false
    final_assault_urgency_variant: true
  controls:
    music_volume: true
    sfx_volume: true
    music_mute: true
    sfx_mute: true
    global_mute: true
  asset_policy:
    generated_web_audio_preferred_for_sfx: true
    locally_bundled_audio_allowed: true
    external_runtime_audio_dependency: false
accessibility:
  reduced_screen_shake: true
  reduced_flashing: true
  colour_blind_friendly_cues: true
  remappable_keys: true
  readable_text_contrast: true
  pause_on_window_blur: true
attract_mode:
  enabled: true
  location: title_screen_background
  AI:
    style: simple_competent
    human_like_error_model_required: false
  seeded_demo: true
  demo_has_no_high_score_eligibility: true
debug:
  enabled: true
  query_string:
    master_switch: debug=true
    options:
      level: level
      seed: seed
      difficulty: difficulty
      lives: lives
      frenzy: frenzy
      config_override: cfg.<BattyJoe.Config dot path>=<value>
      final_assault_helper_reset:
        preferred_generic_form: cfg.finalAssault.helperResetPolicy
        allowed_values:
        - destroyed_only
        - any_hit
        - never
      frenzy_type_values:
      - invaders
      - fps
      - pinball
      - asteroids
      - missile
      - revenge
      - gridrunner
    config_overrides:
      enabled: true
      requires_debug_true: true
      syntax: cfg.<dot.separated.config.path>=<value>
      examples:
      - debug=true&cfg.finalAssault.helperResetPolicy=never
      - debug=true&cfg.finalAssault.hunterAssistDelay1=3
      - debug=true&cfg.finalAssault.magneticAssist.maxHeadingDegreesPerSecond=12
      - debug=true&cfg.frenzy.totalMaxPerLevel=6
      - debug=true&cfg.frenzy.fps.fallingBrick.warningSeconds=1
      - debug=true&cfg.finalAssault.speedMaxMultiplier=1.5
      - debug=true&cfg.finalAssault.magnetismMaxDegreesPerSecond=40
      - debug=true&cfg.finalAssault.bigBomb.passiveFullChargeSeconds=10
      - debug=true&cfg.finalAssault.bigBomb.damage=3
      - debug=true&cfg.frenzy.pinball.duration=120
      - debug=true&cfg.physics.ball.spin.paddleVelocityContribution=1.0
      - debug=true&cfg.physics.collision.brickImperfectionDegrees=5
      - debug=true&cfg.frenzy.pinball.outlaneWidth=24
      - debug=true&cfg.frenzy.pinball.ballRestitution=0.75
      - debug=true&cfg.bigBomb.passiveFullChargeSeconds=60
      - debug=true&cfg.bigBomb.destroyChargePercent=3
      - debug=true&cfg.frenzy.pinball.flipperPower=1.5
      - debug=true&cfg.frenzy.pinball.flipperTipBonus=1.3
      - debug=true&cfg.bigBomb.pickupsRequired=2
      - debug=true&cfg.bigBomb.spawnMinSeconds=10&cfg.bigBomb.spawnMaxSeconds=15
      scope:
        primitive_leaf_values_only: true
        numbers: true
        booleans: true
        strings: true
        arrays: false
        objects: false
        functions: false
      validation:
        path_must_exist_in_BattyJoe_Config: true
        type_must_match_default_config_value: true
        numeric_value_must_be_finite: true
        enum_string_must_match_declared_allowed_values_when_configured_as_enum: true
        unknown_or_invalid_override: ignore_and_report_in_debug_overlay_and_console
        duplicate_parameter_rule: last_value_wins
      application_order:
      - load_static_BattyJoe_Config_defaults
      - parse_debug_query_string
      - apply_valid_cfg_overrides_to_runtime_config_clone
      - create_game_systems_from_runtime_config
      - start_or_resume_campaign
      persistence:
        query_overrides_are_session_only: true
        must_not_write_overridden_values_to_saved_settings: true
        continue_uses_current_url_overrides_for_current_session: true
      competitive_integrity:
        any_valid_config_override_makes_high_score_ineligible: true
        debug_mode_already_makes_high_score_ineligible: true
      visibility:
        debug_overlay_lists_active_overrides: true
        console_logs_applied_overrides: true
  overlay:
    show_when_debug_enabled:
    - fps
    - collision_boxes
    - game_state
    - campaign_seed
    - entity_counts
    - ball_velocity
    - active_rng_state
  cheat_keys:
    debug_only: true
    actions_required:
    - spawn_each_powerup
    - advance_level
    - destroy_all_required_bricks
    - add_life
    - toggle_invulnerability
    - jump_to_boss
    - trigger_space_invaders_frenzy
    - trigger_fps_frenzy
    - cycle_frenzy_type
    - trigger_final_assault
