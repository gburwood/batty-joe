application:
  name: Batty Joe
  type: browser_arcade_brick_breaker
  genre:
  - brick_breaker
  - arcade
  - action
  version: 1.8.0
  status: active_development_specification
  source_of_truth: true
specification_governance:
  authority: 'This development specification is the authoritative source of truth. Generated code must conform to the current
    specification and must not silently introduce requirements absent from it.

    '
  workflow:
  - change_request
  - impact_analysis
  - updated_specification_sections
  - semantic_version_bump
  - full_yaml_when_requested
  - regenerated_artifacts
  versioning:
    patch: Corrections, bug fixes and specification clarifications.
    minor: Backward-compatible features and gameplay additions.
    major: Substantial architectural or gameplay changes.
  generated_artifact_header:
    required: true
    format: Batty Joe Development Specification v{version}
  changelog_required: true
platform:
  host: desktop_web_browser
  supported_browsers:
  - Google Chrome
  - Microsoft Edge
  - Mozilla Firefox
  mobile_support: false
  primary_input: keyboard
  build_process: none
  npm_required: false
  node_required: false
  internet_dependency: false
  offline_capable: true
  deployment_style: drop_in_browser_files
technology:
  html5: true
  css3: true
  javascript: true
  canvas:
    enabled: true
    purpose: gameplay_rendering
  dom_ui:
    enabled: true
    purpose:
    - menus
    - hud_overlays
    - settings
    - dialogs
    - high_score_entry
  web_audio:
    enabled: true
    use_for_generated_sfx: true
  third_party_game_framework: false
  physics_engine: false
  libraries:
    policy: 'Prefer vanilla browser APIs. Add a lightweight third-party library only when it clearly solves a problem that
      would otherwise add unnecessary complexity, and only if it can be bundled locally for offline use.

      '
artifacts:
  required:
  - batty-joe.html
  - batty-joe.css
  - batty-joe.js
  - batty-joe-game.js
  - batty-joe-physics.js
  - batty-joe-levels.js
  - batty-joe-audio.js
  - batty-joe-storage.js
  - batty-joe-config.js
  - batty-joe-tests.html
  - batty-joe-tests.js
  architecture:
    script_style: plain_browser_scripts
    es_modules_required: false
    global_namespace:
      required: true
      name: BattyJoe
    rule: 'Keep responsibilities modular and avoid a single monolithic JavaScript file. Files must work when copied together
      and opened from a static host without a build step.

      '
game_identity:
  title: Batty Joe
  visual_style: classic_arcade
  mascot_character: false
  humour:
    enabled: true
    allowed_in:
    - level_titles
    - death_messages
    - frenzy_announcements
    - boss_taunts
    - menu_flavour_text
    constraint: Humour must not obscure important gameplay information.
core_gameplay:
  objective: 'Control a paddle, keep one or more balls in play, destroy all required bricks, and advance through a campaign
    of up to 20 levels.

    '
  starting_lives: 3
  max_lives: 9
  simultaneous_ball_cap: 6
  lose_life_when: last_active_ball_exits_bottom
  level_complete_when: all_non_indestructible_required_bricks_are_destroyed
  campaign_levels: 20
  finite_campaign: true
  post_victory:
    show_victory_sequence: true
    offer_harder_loop_from_level_1: true
game_states:
  centrally_managed: true
  states:
  - BOOT
  - MENU
  - ATTRACT
  - PLAYING
  - PAUSED
  - LIFE_LOST
  - LEVEL_COMPLETE
  - FRENZY_TRANSITION_IN
  - FRENZY_ACTIVE
  - FRENZY_TRANSITION_OUT
  - BOSS
  - GAME_OVER
  - CONTINUE
  - VICTORY
  transitions:
    rule: 'State changes must be performed through a central state controller rather than by unrelated modules mutating screen
      and gameplay state independently.

      '
  modal_overrides:
    frenzy:
      enabled: true
      priority: above_normal_gameplay_and_powerup_effects
      reentrant_activation_allowed: false
      normal_gameplay_simulation_suspended_while_active: true
controls:
  movement:
    left:
    - ArrowLeft
    - KeyA
    right:
    - ArrowRight
    - KeyD
    movement_model: slight_inertia
    behaviour: 'Paddle acceleration and deceleration should create a mild inertia effect while remaining responsive enough
      for arcade play.

      '
  action:
    launch_or_fire: Space
    pause: Escape
    fullscreen: KeyF
  remappable:
    enabled: true
  context_sensitive_space:
    pre_launch: launch_ball
    sticky_ball_held: release_ball
    laser_active: fire_laser
    frenzy_active: fire_current_frenzy_weapon
  fps_frenzy:
    aiming:
      mouse: true
      keyboard: true
      keyboard_keys:
        left: KeyA
        right: KeyD
        up: KeyW
        down: KeyS
      mouse_controls_full_crosshair: true
      keyboard_controls_crosshair: true
    strafe:
      left: ArrowLeft
      right: ArrowRight
      vertical_strafe: false
    fire:
      keyboard: Space
      mouse: MousePrimary
  pinball_frenzy:
    left_flipper:
    - ArrowLeft
    - KeyA
    right_flipper:
    - ArrowRight
    - KeyD
    both_flippers: Space
    nudge:
      enabled: true
      key: ArrowUp
      cooldown_seconds: 1.0
      strength: small
  asteroids_frenzy:
    rotate_left:
    - ArrowLeft
    - KeyA
    rotate_right:
    - ArrowRight
    - KeyD
    thrust:
    - ArrowUp
    - KeyW
    fire: Space
  missile_command_frenzy:
    aiming:
      mouse: true
      keyboard: true
      keyboard_keys:
        left: KeyA
        right: KeyD
        up: KeyW
        down: KeyS
    fire:
    - Space
    - MousePrimary
  arkanoid_revenge_frenzy:
    move_left:
    - ArrowLeft
    - KeyA
    move_right:
    - ArrowRight
    - KeyD
    serve_or_release: Space
  final_assault: {}
  big_bomb:
    default_key: ArrowDown
    remappable: true
    available_during_level_gameplay_when_ready: true
display:
  playfield:
    layout: fixed_aspect_ratio
    centered: true
    scalable: true
    fullscreen_supported: true
    reference_width: 960
    reference_height: 720
  scaling:
    preserve_gameplay_proportions: true
    high_dpi_aware: true
    high_refresh_display_support: true
  target_fps: 60
  rendering:
    request_animation_frame: true
    delta_time_based: true
    refresh_rate_independent_simulation: true
  backgrounds:
    style: simple
    options:
    - solid
    - subtle_gradient
    animated_backgrounds: false
  ball_visual:
    style: traditional
  paddle_visual:
    style: techie
    should_support_ship_transformation: true
    should_support_pinball_flipper_transformation: true
    should_support_asteroids_ship_transformation: true
    should_support_revenge_top_paddle_transformation: true
  bricks:
    graphical: true
    appearance_must_communicate:
    - type
    - durability
    - damage_state
  effects:
    particles:
      enabled: true
      intensity: restrained
    screen_shake:
      enabled: true
      default_intensity: low
      used_for:
      - explosions
      - boss_hits
      - frenzy_transition_in
      - frenzy_transition_out
  accessibility_visual_cues:
    never_rely_on_colour_alone: true
  frenzy_transitions:
    default_enter_seconds: 2.5
    default_exit_seconds: 2.0
    screen_shake: pronounced_but_bounded
    particles: true
    morphing_required: true
    reduced_motion_fallback: short_fade_and_slide_without_heavy_shake_or_flashing
  pseudo_3d:
    enabled_for_fps_frenzy: true
    renderer: canvas_2d_perspective_projection
    webgl_required: false
    brick_rendering: solid_extruded_cuboids_at_deterministically_varied_depths
    depth_is_visually_significant: true
    occlusion_required: true
    depth_sorting_required: true
  fps_frenzy_view:
    presentation: first_person_down_the_barrel
    reference_style: early_1990s_corridor_fps
    normal_paddle_visible: false
    normal_paddle_entity_used_for_rendering_or_aiming: false
    weapon_rendering:
      visible: true
      type: rifle
      position: lower_centre_of_view
      perspective: down_the_barrel
      independent_of_normal_paddle_entity: true
      muzzle_flash: true
      recoil_animation: true
    crosshair_visible: true
    camera:
      first_person: true
      horizontal_strafe: true
      forward_backward_movement: false
      vertical_movement: false
  frenzy_mode_visual_identity:
    pinball: neon_arcade_pinball_table_with_flippers_bumpers_and_lanes
    asteroids: vector_inspired_spacefield_with_wrapping_ship_and_chunky_asteroids
    missile_command: radar_defence_view_with_missile_trails_and_expanding_interception_blasts
    arkanoid_revenge: inverted_brick_breaker_duel_with_enemy_brick_paddle
physics:
  engine: custom_deterministic
  timestep:
    delta_time_based: true
    clamp_large_frame_gaps: true
  ball:
    launches_from_paddle: true
    launch_trigger: any_launch_action_key
    auto_launch: false
    paddle_hit_angle_control: true
    paddle_hit_rule: 'Ball reflection angle is influenced by the horizontal impact position on the paddle. Centre hits are
      shallower; edge hits create more lateral motion.

      '
    minimum_vertical_component_required: true
    prevent_near_horizontal_lock: true
    speed_progression:
      increases_during_level: true
      higher_base_speed_on_later_levels: true
      tuning:
        easy:
          base_speed_multiplier: 0.9
          in_level_acceleration_multiplier: 0.85
        normal:
          base_speed_multiplier: 1.0
          in_level_acceleration_multiplier: 1.0
        hard:
          base_speed_multiplier: 1.12
          in_level_acceleration_multiplier: 1.15
    spin_and_swerve:
      enabled: true
      principle: Horizontal paddle velocity at paddle contact is the dominant source of ball spin. Spin affects both in-flight
        curvature and the angle produced by subsequent collisions.
      spin_state_per_ball: true
      spin_range:
      - -1.25
      - 1.25
      imparted_on_paddle_contact:
        paddle_velocity_contribution: 0.9
        contact_offset_contribution: 0.1
        moving_paddle_is_primary_source: true
        stationary_paddle_can_impart_small_spin_from_edge_contact: true
        paddle_velocity_is_normalised_against_maximum_paddle_speed: true
        fast_opposite_direction_paddle_motion_can_reverse_existing_spin: true
      flight_effect:
        model: perpendicular_heading_curvature
        maximum_heading_change_degrees_per_second: 18
        preserve_target_ball_speed: true
        minimum_vertical_component_rule_still_applies: true
        visual_cue: visible_but_restrained_curved_trail_or_ball_rotation
      decay:
        enabled: true
        half_life_seconds: 2.4
        near_zero_snap_threshold: 0.02
      collision_retention:
        wall: 0.82
        brick: 0.78
        paddle: recalculate_from_current_contact
        explosion: 0.7
      deterministic: true
      applies_to_multiball_independently: true
      disabled_when_frenzy_mode_uses_non_ball_gameplay: true
      collision_angle_effect:
        enabled: true
        principle: Spin modifies the ideal reflected heading after wall and brick collisions, producing visible English rather
          than a mathematically perfect mirror reflection.
        maximum_spin_deflection_degrees:
          brick: 12
          screen_edge: 9
          paddle: 15
        direction: spin_sign_controls_tangential_deflection
        applied_after_geometric_reflection: true
        applied_before_minimum_vertical_component_and_speed_normalisation: true
        spin_is_not_consumed_by_the_deflection: true
    bat_release_angle:
      enabled: true
      applies_to:
      - initial_level_launch
      - life_restart_launch
      - sticky_paddle_release
      principle: The horizontal position of the held ball on the bat determines the release angle. Centre releases are nearly
        vertical; releases nearer an edge angle toward that side.
      mapping:
        input: normalised_ball_offset_from_bat_centre
        input_range:
        - -1.0
        - 1.0
        output: launch_angle_from_vertical_degrees
        output_range_degrees:
        - -60
        - 60
        curve: linear
        left_side_launches_left: true
        right_side_launches_right: true
        centre_launches_vertical: true
      constraints:
        minimum_vertical_component_rule_still_applies: true
        release_speed_uses_current_target_ball_speed: true
        spin_does_not_change_initial_release_mapping_until_after_release: true
    paddle_velocity_transfer:
      enabled: true
      principle: Paddle contact transfers a bounded amount of paddle motion into temporary ball speed as well as spin.
      inputs:
        paddle_speed_ratio: absolute paddle horizontal velocity divided by configured maximum paddle speed, clamped 0..1
        contact_offset: normalised ball contact offset from paddle centre, -1..1
      configuration:
        runtime_path: BattyJoe.Config.physics.paddleVelocityTransfer
        maxBoostPercent: 0.25
        decayHalfLifeSeconds: 0.65
        centreContactFactor: 0.55
        edgeContactFactor: 1.0
      boost_formula: maxBoostPercent * paddle_speed_ratio * lerp(centreContactFactor, edgeContactFactor, abs(contact_offset))
      stationary_paddle_adds_no_motion_boost: true
      boost_is_per_ball_transient_state: true
      repeated_hits_do_not_compound_beyond_configured_cap: true
      decay: exponential toward the current effective target ball speed
      effective_target_speed_includes:
      - difficulty_and_level_progression
      - slow_ball_powerup
      - fast_ball_powerup
      - final_assault_speed_multiplier
      minimum_vertical_component_rule_still_applies: true
      spin_model_remains_independent: true
      disabled_behaviour: No temporary paddle-derived speed boost; existing spin/contact-angle behaviour remains.
  collision:
    deterministic_for_same_state: true
    continuous_collision_protection: true
    resolve_corner_cases: true
    spin_must_not_create_tunnelling: true
    combined_steering_order:
    - base_geometric_collision_reflection
    - deterministic_imperfect_rebound_variation
    - spin_collision_angle_deflection
    - ball_spin_in_flight_swerve
    - final_assault_magnetism_if_active
    - minimum_vertical_component_enforcement
    - target_speed_normalisation
    imperfect_rebound:
      enabled: true
      purpose: Avoid sterile mathematically perfect brick and screen-edge rebounds while keeping gameplay deterministic and
        learnable.
      deterministic: true
      source: seeded_collision_signature_not_unseeded_random
      brick:
        maximum_variation_degrees: 3.5
        variation_changes_by_collision_event: true
      screen_edge:
        maximum_variation_degrees: 2.0
        variation_changes_by_collision_event: true
      paddle:
        uses_existing_contact_position_plus_spin_model: true
        additional_random_variation_degrees: 0
      constraints:
        must_not_reverse_resolved_collision_normal: true
        must_not_create_near_horizontal_lock: true
        minimum_vertical_component_rule_still_applies: true
        target_ball_speed_is_preserved: true
    paddle_velocity_transfer_is_applied_on_paddle_contact: true
difficulty:
  modes:
  - easy
  - normal
  - hard
  selected_on_new_game: true
  affects:
  - starting_ball_speed
  - in_level_ball_acceleration
  - brick_toughness
  - moving_brick_frequency
  - indestructible_brick_frequency
  - positive_powerup_frequency
  - negative_powerup_frequency
  - layout_complexity
  - regenerating_brick_frequency
  - invisible_brick_frequency
  - boss_pressure
  score_multiplier_by_difficulty: false
campaign_generation:
  style:
  - templates
  - symmetry
  - controlled_randomness
  deterministic: true
  campaign_seed:
    one_seed_generates_entire_campaign: true
    user_can_enter_seed: true
    random_seed_option: true
    visible_in_pause_ui: true
    visible_in_game_ui: true
    stored_with_high_score: true
  seeded_randomness:
    level_layouts: true
    powerup_drops: true
    gameplay_random_events: true
    requirement: 'The same campaign seed plus the same difficulty and versioned generation rules must reproduce the same campaign
      and seeded gameplay randomness across supported browsers.

      '
  future_support:
    handcrafted_levels: true
  generation_constraints:
    always_playable: true
    avoid_unreachable_required_bricks: true
    template_parameters_data_driven: true
    symmetry_options:
    - horizontal
    - vertical
    - rotational
    - none
    randomness_must_be_bounded: true
  level_progression:
    difficulty_increases_with_level: true
    max_level: 20
brick_system:
  types:
    normal:
      destructible: true
      base_hits: 1
      score_weight: 1.0
    multi_hit:
      destructible: true
      hits_scale_with_level: true
      initial_hits_min: 2
      initial_hits_max: 3
      later_level_hits_max: 6
      appearance_shows_strength: true
      score_weight: 1.4
    indestructible:
      destructible_in_normal_play: false
      destructible_by_penetrating_ball: false
      destructible_in_frenzy: true
      required_for_normal_level_completion: false
      score_weight_when_destroyed_in_frenzy: 2.0
    explosive:
      destructible: true
      explosion:
        destroys_adjacent_destructible_bricks: true
        damages_or_destroys_by_target_rules: true
        chain_reaction: true
        chain_distance: adjacent_or_close_enough_for_explosion_radius
        default_radius_in_brick_units: 1.25
      score_weight: 1.6
    moving:
      destructible: true
      movement:
        axis: horizontal
        collision_behaviour: reverse_or_clamp_within_assigned_lane
        may_overlap_other_bricks: false
      score_weight: 1.6
    invisible:
      destructible: true
      visibility:
        shimmer_occasional: true
        otherwise_low_visibility: true
      score_weight: 1.7
    regenerating:
      destructible: true
      modes:
      - heal_after_delay
      - respawn_after_destruction
      mode_selected_by_level_or_template: true
      default_heal_delay_seconds: 4
      default_respawn_delay_seconds: 6
      score_weight: 1.9
    powerup:
      destructible: true
      visibly_special: true
      guaranteed_or_high_probability_drop: true
      score_weight: 1.2
  property_communication:
    visual_encoding_required: true
    use:
    - colour
    - shape
    - texture
    - damage_marks
    - animation
    colour_only_not_sufficient: true
powerups:
  naming_style: generic_functional
  drop_model:
    mixture:
    - random_on_destructible_brick
    - visibly_special_powerup_brick
    - hidden_predetermined_seeded_drop
    fall_direction: straight_down
    missed_powerup: despawn_below_playfield
  duration_model: per_powerup
  active_effects_removed_on_life_loss: true
  stacking_policy: explicit_compatibility_rules
  types:
    wide:
      category: paddle_size
      positive: true
      duration_seconds: 15
      stacks: true
      stack_effect: progressively_wider
      max_width_multiplier: 2.0
    narrow:
      category: paddle_size
      positive: false
      duration_seconds: 12
      stacks: true
      stack_effect: progressively_narrower
      min_width_multiplier: 0.5
    multiball:
      category: ball_count
      positive: true
      instant: true
      behaviour: split_each_existing_ball
      maximum_total_balls: 6
    sticky:
      category: paddle_ability
      positive: true
      duration_seconds: 15
      behaviour: 'Balls contacting the paddle are held and can be released with Space.

        '
      maximum_hold_seconds: 3
      release_angle_rule: use_physics_ball_bat_release_angle_from_current_held_ball_position
    laser:
      category: paddle_weapon
      positive: true
      duration_seconds: 15
      fire_control: hold_space
      fire_style: machine_gun
      fire_rate_shots_per_second: 8
      normal_brick_damage: destroy_in_one_hit
      stronger_brick_damage: one_damage_unit_per_hit
      indestructible_brick_damage: 0
    slow_ball:
      category: ball_speed
      positive: true
      duration_seconds: 10
      speed_multiplier: 0.72
      applies_to_all_active_balls: true
      expiry_behaviour: snap_back
    fast_ball:
      category: ball_speed
      positive: false
      duration_seconds: 10
      speed_multiplier: 1.3
      applies_to_all_active_balls: true
      expiry_behaviour: snap_back
    extra_life:
      category: life
      positive: true
      instant: true
      amount: 1
      max_lives: 9
    penetrating_ball:
      category: ball_ability
      positive: true
      duration_seconds: 12
      behaviour: 'Active balls pass through destructible bricks while applying their normal impact damage without reflecting
        from those bricks.

        '
      indestructible_behaviour: bounce
      can_destroy_indestructible: false
    imprecise_paddle:
      category: control_penalty
      positive: false
      duration_seconds: 10
      behaviour: 'Temporarily reduce paddle control precision by increasing inertia, slightly reducing acceleration response
        and adding small deterministic steering drift derived from the campaign RNG.

        '
    space_invaders_frenzy:
      category: mode_change
      positive: true
      display_name: INVADERS
      rarity: rare
      visually_distinct_pickup: true
      activates: space_invaders_frenzy
    fps_frenzy:
      category: mode_change
      positive: true
      display_name: FPS
      rarity: rare
      visually_distinct_pickup: true
      activates: fps_frenzy
    pinball_frenzy:
      category: mode_change
      positive: true
      display_name: PINBALL
      rarity: rare
      visually_distinct_pickup: true
      activates: pinball_frenzy
    asteroids_frenzy:
      category: mode_change
      positive: true
      display_name: ASTEROIDS
      rarity: rare
      visually_distinct_pickup: true
      activates: asteroids_frenzy
    missile_command_frenzy:
      category: mode_change
      positive: true
      display_name: MISSILE
      rarity: rare
      visually_distinct_pickup: true
      activates: missile_command_frenzy
    arkanoid_revenge_frenzy:
      category: mode_change
      positive: true
      display_name: REVENGE
      rarity: rare
      visually_distinct_pickup: true
      activates: arkanoid_revenge_frenzy
  compatibility:
    explicit: true
    rules:
    - pair:
      - wide
      - sticky
      allowed: true
    - pair:
      - wide
      - laser
      allowed: true
    - pair:
      - sticky
      - laser
      allowed: true
    - pair:
      - slow_ball
      - multiball
      allowed: true
    - pair:
      - fast_ball
      - multiball
      allowed: true
    - pair:
      - penetrating_ball
      - sticky
      allowed: true
    - pair:
      - wide
      - narrow
      allowed: false
      resolution: new_pickup_replaces_existing_size_effect
    - pair:
      - slow_ball
      - fast_ball
      allowed: false
      resolution: new_pickup_replaces_existing_speed_effect
    default_for_unlisted_pairs: allowed_when_semantically_independent
  frenzy_drop_rules:
    do_not_spawn_any_frenzy_pickup_while_a_frenzy_is_active_or_transitioning: true
    same_tick_multiple_frenzy_pickups: resolve_deterministically_by_pickup_id_and_activate_only_one
    per_type_occurrence_limits_are_configurable: true
scoring:
  enabled: true
  brick_score:
    base_points: 100
    increases_with_toughness: true
    type_weighting_from_brick_config: true
  no_paddle_combo:
    enabled: true
    shared_across_multiball: true
    increments_on_required_brick_damage_or_destruction: true
    resets_on_any_ball_paddle_contact: true
    multiplier_curve:
      start: 1
      step: 1
      max: 10
  rapid_destruction_combo:
    enabled: true
    window_seconds: 2
    separate_from_no_paddle_combo: true
    multiplier_curve:
      start: 1
      step: 1
      max: 8
  explosion_scoring:
    score_every_destroyed_brick: true
    chain_reaction_bonus: true
    chain_bonus_points_per_additional_explosion: 150
  frenzy_scoring:
    enabled: true
    own_multiplier: true
    multiplier_start: 2
