    - crosshair_materialises
    - hud_crossfades_to_fps_frenzy_hud
    - unlock_fps_controls
    exit_seconds: 2.0
    exit_sequence:
    - lock_fps_controls
    - screen_shake_and_camera_pull_back
    - rifle_drops_out_of_first_person_view
    - surviving_blocks_converge_along_depth_axis
    - surviving_blocks_compress_from_solid_3d_cuboids_to_2d_bricks
    - crosshair_fades_out
    - restore_normal_paddle_from_suspended_snapshot
    - restore_suspended_normal_gameplay_state
    - unlock_normal_controls
  view:
    perspective: first_person_down_the_barrel
    camera_movement: horizontal_strafe_only
    normal_paddle_visible: false
    normal_paddle_gameplay_relevance: none_while_fps_frenzy_is_active
    weapon: first_person_rifle_independent_of_paddle
    brick_layout: preserve_recognisable_normal_xy_arrangement_but_assign_varied_z_depth
    depth_model:
      type: deterministic_per_brick_depth
      minimum_depth: 0.55
      maximum_depth: 1.45
      derived_from:
      - campaign_seed
      - level
      - brick_id
      must_avoid_unfair_complete_occlusion_of_required_targets: true
      closer_bricks_render_larger: true
      farther_bricks_render_smaller: true
      depth_sorting: far_to_near
      camera_strafe_changes_parallax: true
    renderer: canvas_2d_perspective_projection
    solid_geometry: extruded_cuboids_with_visible_front_side_and_top_faces
    falling_attack_readability:
      falling_bricks_descend_from_top_of_first_person_view: true
      perspective_scaling_allowed: true
      world_trajectory_must_remain_vertical: true
      no_homing_or_curved_attack_paths: true
  aiming:
    mouse_crosshair: true
    keyboard_crosshair: true
    keyboard_aim_keys:
      left: KeyA
      right: KeyD
      up: KeyW
      down: KeyS
    crosshair_visible: true
    crosshair_clamped_to_playfield: true
    aiming_is_independent_of_camera_strafe: true
  movement:
    strafe_left_key: ArrowLeft
    strafe_right_key: ArrowRight
    vertical_movement: false
    forward_backward_movement: false
    strafe_changes_camera_parallax_and_target_projection: true
    normal_paddle_does_not_move_or_render: true
    falling_brick_world_trajectory_remains_straight_during_strafe: true
  rifle:
    weapon_model: hitscan
    ammo: unlimited
    fire_rate_limited: true
    fire_rate_shots_per_second: 6
    fire_controls:
