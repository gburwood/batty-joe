    finalAssault.bigBomb.passiveFullChargeSeconds: gameplay.big_bomb.power_bar.passive_full_charge_seconds
    finalAssault.bigBomb.hitChargePercent: gameplay.big_bomb.power_bar.active_charge_sources.required_brick_hit.bonus_percent
    finalAssault.bigBomb.destroyChargePercent: gameplay.big_bomb.power_bar.active_charge_sources.required_brick_destroyed.bonus_percent
    finalAssault.bigBomb.paddleChargePercent: gameplay.big_bomb.power_bar.active_charge_sources.high_speed_paddle_contact.bonus_percent
    finalAssault.bigBomb.damage: gameplay.big_bomb.deployment.damage_per_brick
    frenzy.pinball.duration: pinball_frenzy.duration.maximum_seconds
    physics.ball.spin.paddleVelocityContribution: physics.ball.spin_and_swerve.imparted_on_paddle_contact.paddle_velocity_contribution
    physics.ball.spin.maxFlightHeadingDegreesPerSecond: physics.ball.spin_and_swerve.flight_effect.maximum_heading_change_degrees_per_second
    physics.ball.spin.maxBrickBounceDeflectionDegrees: physics.ball.spin_and_swerve.collision_angle_effect.maximum_spin_deflection_degrees.brick
    physics.ball.spin.maxEdgeBounceDeflectionDegrees: physics.ball.spin_and_swerve.collision_angle_effect.maximum_spin_deflection_degrees.screen_edge
    physics.collision.brickImperfectionDegrees: physics.collision.imperfect_rebound.brick.maximum_variation_degrees
    physics.collision.edgeImperfectionDegrees: physics.collision.imperfect_rebound.screen_edge.maximum_variation_degrees
    frenzy.pinball.outlaneWidth: pinball_frenzy.table.lower_playfield.outlanes.width_pixels
    frenzy.pinball.ballRestitution: pinball_frenzy.ball.restitution.default
    frenzy.pinball.funnelRestitution: pinball_frenzy.ball.restitution.funnel_rail
    bigBomb.passiveFullChargeSeconds: gameplay.big_bomb.power_bar.passive_full_charge_seconds
    bigBomb.hitChargePercent: gameplay.big_bomb.power_bar.active_charge_sources.required_brick_hit.bonus_percent
    bigBomb.destroyChargePercent: gameplay.big_bomb.power_bar.active_charge_sources.required_brick_destroyed.bonus_percent
    bigBomb.paddleChargePercent: gameplay.big_bomb.power_bar.active_charge_sources.high_speed_paddle_contact.bonus_percent
    bigBomb.damage: gameplay.big_bomb.deployment.damage_per_brick
    frenzy.pinball.flipperPower: pinball_frenzy.table.flipper_geometry.power.base_impulse_multiplier
    frenzy.pinball.flipperTipBonus: pinball_frenzy.table.flipper_geometry.power.tip_velocity_bonus_multiplier
    physics.ball.releaseMaxAngleDegrees: physics.ball.bat_release_angle.mapping.output_range_degrees
    bigBomb.pickupsRequired: gameplay.big_bomb.power_bar.pickups_required_default
    bigBomb.spawnMinSeconds: gameplay.big_bomb.big_bomb_power_up.spawn_system.minimum_interval_seconds
    bigBomb.spawnMaxSeconds: gameplay.big_bomb.big_bomb_power_up.spawn_system.maximum_interval_seconds
