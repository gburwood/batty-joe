frenzy_framework:
  enabled: true
  state_flow:
  - FRENZY_TRANSITION_IN
  - FRENZY_ACTIVE
  - FRENZY_TRANSITION_OUT
  modal_override: true
  activation_contract:
    atomic: true
    reject_activation_if_another_frenzy_is_active_or_transitioning: true
    snapshot_before_transition:
    - all_active_balls_and_velocities
    - held_sticky_balls_and_hold_state
    - paddle_position_velocity_size_and_abilities
    - active_powerups_and_remaining_durations
    - normal_gameplay_projectiles
    - combo_state_and_combo_timers
    - seeded_rng_state_relevant_to_normal_play
    - ball_spin_state
    - final_assault_state_and_no_hit_timers
    suspend:
    - normal_ball_simulation
    - normal_paddle_ability_processing
    - normal_gameplay_projectiles
    - all_normal_powerup_duration_timers
    - rapid_combo_expiry_timer
    normal_powerups_must_not_be_reapplied_to_frenzy_entities: true
    normal_powerup_effects_remain_logically_active_but_suspended: true
  restoration_contract:
    on_timeout_or_player_hit:
