fps_frenzy:
  enabled: true
  trigger: distinct_rare_falling_powerup
  display_name: FPS FRENZY
  maximum_occurrences_per_level: from_frenzy_framework_config_default_1
  minimum_suitable_bricks: 8
  lifecycle:
    uses_shared_snapshot_and_restore_contract: true
    normal_powerup_timers_paused: true
    safe_with_all_powerup_combinations: true
  transformation:
    uses_shared_frenzy_framework: true
    enter_seconds: 2.5
    retain_original_brick_arrangement: true
    sequence:
    - freeze_and_snapshot_normal_play
    - hide_and_suspend_normal_paddle
    - screen_shake_and_camera_push_forward_into_first_person_view
    - flat_bricks_extrude_into_solid_3d_cuboids
    - bricks_separate_along_the_depth_axis_while_preserving_their_recognisable_2d_arrangement
    - perspective_occlusion_depth_shadows_and_parallax_build_progressively
