    - MousePrimary
    visual_feedback:
    - muzzle_flash
    - brief_tracer
    - target_hit_flash
    can_destroy_indestructible_bricks: true
    presentation: first_person_down_the_barrel
    independent_of_paddle: true
    normal_paddle_hidden: true
  enemy_blocks:
    fight_back: true
    attack_model: visible_hostile_projectiles_toward_player_viewpoint
    firing_frequency_increases_as_population_falls: true
    brick_properties_map_to_combat_behaviour: true
    normal:
      health_maps_from_brick_state: true
    multi_hit:
      strength_maps_from_remaining_hits: true
    indestructible:
      destructible_during_fps_frenzy: true
      high_strength: true
    explosive:
      retains_explosion: true
      retains_chain_reactions: true
    moving:
      retains_horizontal_motion_within_3d_plane: true
    invisible:
      shimmers_in_3d: true
    regenerating:
      retains_regeneration: true
    powerup:
      retains_visual_identity: true
  duration:
    maximum_seconds: 20
    ends_on:
    - timer_expiry
    - player_hit
    - all_blocks_destroyed
  on_player_hit:
    terminate_frenzy: true
    lose_normal_life: false
    restore_surviving_bricks: true
  on_timeout:
    restore_surviving_bricks: true
  restoration:
    surviving_blocks_return_to_exact_original_2d_positions: true
    surviving_blocks_restore_prior_damage_state_plus_frenzy_damage: true
    blocks_destroyed_during_frenzy_remain_destroyed: true
  full_clear:
    completes_level_immediately: true
    awards_fps_frenzy_clear_bonus: true
    bonus_points: 10000
  enemy_fire:
    enabled: false
    rule: FPS Frenzy must not fire perspective projectiles toward the player.
    reason: Perspective projectiles become confusing while strafing. Hostile attacks use vertically falling bricks instead.
  falling_brick_attacks:
    enabled: true
    principle: Selected surviving bricks detach from the 3D formation and fall vertically from above toward the player's horizontal
      world lane. Their horizontal world position locks at detachment, so strafing changes the viewpoint but never makes an
      attack home or curve.
    attack_source: surviving_bricks
    selection:
      deterministic_seeded: true
      do_not_select_same_brick_while_already_falling: true
      prefer_front_and_mid_depth_bricks: true
      allow_all_brick_types: true
    telegraph:
      enabled: true
      warning_seconds: 0.65
      brick_rises_or_pulses_before_detaching: true
      fall_lane_indicator: true
      indicator_tracks_world_lane_not_screen_curve: true
      reduced_flashing_safe: true
    motion:
      type: vertical_world_drop
      horizontal_world_position_locked_after_detach: true
      must_not_curve_toward_player_after_detach: true
      camera_strafe_changes_only_viewpoint_and_relative_screen_position: true
      fall_speed_pixels_per_second: 360
      gravity_acceleration_pixels_per_second_squared: 260
    player_collision:
      model: horizontal_lane_overlap_at_player_impact_plane
      player_hit_terminates_frenzy: true
      lose_normal_life: false
      clear_hitbox_visualisation_in_debug_mode: true
    player_counterplay:
      falling_bricks_can_be_shot: true
      hitscan_uses_normal_fps_damage_rules: true
      destroying_falling_brick_counts_as_destroying_that_original_brick: true
      damaging_but_not_destroying_brick_preserves_damage: true
    missed_attack:
      when_brick_reaches_floor_without_hitting_player: return_to_remembered_3d_formation_position
      recovery_seconds: 0.55
      health_and_damage_preserved: true
    rate:
      base_interval_seconds: 1.45
      minimum_interval_seconds: 0.55
      increase_as_brick_population_falls: true
      maximum_simultaneous_falling_bricks: 2
      easy_maximum_simultaneous: 1
      normal_maximum_simultaneous: 2
      hard_maximum_simultaneous: 2
    brick_type_behaviour:
      normal: standard_fall
      multi_hit: retains_remaining_hit_points
      indestructible: destructible_under_fps_frenzy_rules_and_falls_as_heavy_block
      explosive: can_be_detonated_while_falling_and_chain_react_with_nearby_formation_bricks
      moving: stops_horizontal_brick_motion_while_falling
      invisible: becomes_sufficiently_visible_during_telegraph_and_fall
      regenerating: regeneration_pauses_while_falling_and_resumes_after_return
      powerup: standard_fall_with_powerup_identity_visual_cue
final_assault:
  enabled: true
  purpose: Create an escalating end-of-level climax with continuously increasing speed, visibly stronger magnetic steering
    and one deployable Big Bomb.
  activation:
    required_bricks_remaining_fraction: 0.1
    maximum_required_bricks_remaining: 6
    threshold_formula: min(6, max(1, ceil(initial_required_brick_count * 0.10)))
    not_active_during:
    - FRENZY_TRANSITION_IN
    - FRENZY_ACTIVE
    - FRENZY_TRANSITION_OUT
    - BOSS
    activate_after_frenzy_restoration_if_threshold_is_met: true
  presentation:
    announcement: FINAL ASSAULT!
    remaining_required_bricks_pulse: true
    remaining_required_bricks_have_enhanced_non_colour_visual_cues: true
    music_urgency_increase: true
    sfx_urgency_increase: true
    screen_effect_intensity: low
  gameplay:
    ball_speed_multiplier: 1.1
    respect_global_ball_speed_cap: true
    remaining_required_brick_score_multiplier: 2.0
    explosive_chain_scores_also_receive_final_assault_multiplier: true
    ball_spin_remains_active: true
    ball_speed_increase: continuous_ramp_to_configured_maximum
    magnetism: continuous_visible_ramp_throughout_final_assault
    big_bomb: single_use_after_power_bar_full
  hunter_assist:
    enabled: true
    principle: Bias paddle reflection toward a reachable remaining required brick without creating a homing ball.
    stage_1:
      seconds_without_required_brick_hit: 4
      next_paddle_bounce_angle_bias_strength: 0.18
    stage_2:
      seconds_without_required_brick_hit: 7
      next_paddle_bounce_angle_bias_strength: 0.32
    maximum_angle_adjustment_degrees: 25
    target_selection: seeded_nearest_reachable_required_brick_with_clear_reasonable_trajectory
    applies_only_on_paddle_bounce: true
    never_changes_ball_position_directly: true
    never_guarantees_a_hit: true
    disabled_during_multimode_transitions: true
    stage_3:
      seconds_without_required_brick_hit: 10
      enables_magnetic_assist: true
    timer_reset_rule: use_final_assault_helper_progress_reset_policy
  completion:
    ends_immediately_when_level_completion_condition_is_met: true
    no_separate_life_or_continue_cost: true
  magnetic_assist:
    enabled: true
    activation: progressive_throughout_final_assault
    principle: Remaining required bricks visibly attract the ball strongly enough to create unmistakable arcade-style curved
      trajectories while retaining player influence.
    force_model:
      sum_attraction_from_all_remaining_required_bricks: true
      distance_weighted: true
      maximum_effect_distance_pixels: 380
      minimum_effect_distance_pixels: 35
      preserve_ball_speed: true
      must_not_reverse_vertical_direction: true
      must_not_teleport_or_snap_ball: true
      disabled_within_pixels_of_paddle: 45
    interaction_with_spin:
      both_can_apply: true
      spin_applied_first: true
      magnetic_steering_applied_second: true
      combined_heading_change_capped_degrees_per_second: 36
    multiball:
      applies_to_each_ball_independently: true
      balls_do_not_attract_each_other: true
    visual_cue:
      strong_curved_ball_trail: true
      trail_curvature_should_make_magnetic_effect_obvious: true
      subtle_energy_filaments_between_ball_and_nearby_required_bricks: true
      remaining_bricks_pulse_more_strongly_as_magnetic_strength_increases: true
      reduced_flashing_setting_reduces_effect: true
    ends_when_final_assault_ends: true
    timer_reset_rule: use_final_assault_helper_progress_reset_policy
    strength_progression:
      start_heading_change_degrees_per_second: 6
      maximum_heading_change_degrees_per_second: 30
      ramp_seconds: 15.0
      ramp: continuous_linear
      after_ramp: hold_at_maximum_strength
  helper_progress:
    shared_timer: true
    description: Hunter Assist stages and magnetic assist are driven by one shared elapsed-time-since-reset value. Ordinary
      damage to a surviving required brick does not reset helper progress by default.
    reset_policy:
      config_key: finalAssault.helperResetPolicy
      default: destroyed_only
      allowed_values:
      - destroyed_only
      - any_hit
      - never
      behaviour:
        destroyed_only: Reset helper elapsed time and return to helper stage 0 only when a required brick is destroyed.
        any_hit: Reset helper elapsed time and return to helper stage 0 whenever a required brick is successfully damaged.
          This preserves the earlier v1.2.2 behaviour and is available for tuning.
        never: Do not reset helper elapsed time during Final Assault. Once helper stages activate they remain active until
          Final Assault ends.
    non_required_brick_events:
      never_reset_helper_timer: true
    indestructible_normal_play_contact:
      never_reset_helper_timer: true
    explosive_chain:
      reset_evaluation: Evaluate the configured reset policy from actual required-brick outcomes. Under destroyed_only, any
        required brick destroyed by the chain resets helper progress once for the chain event.
    multiball:
      simultaneous_events_are_coalesced_per_simulation_step: true
      maximum_resets_per_simulation_step: 1
  speed_escalation:
    enabled: true
    starts_immediately_when_final_assault_activates: true
    start_multiplier: 1.0
    maximum_multiplier: 1.35
    ramp_seconds: 15.0
    ramp: continuous_linear
    after_ramp: hold_at_maximum_multiplier
    applies_to: all_normal_play_balls
    multiball: each_ball_receives_same_final_assault_speed_multiplier
    preserve_existing_ball_spin: true
  big_bomb:
    ownership: level_gameplay_big_bomb
    available_during_final_assault_if_ready_and_not_used: true
    final_assault_does_not_charge_reset_or_modify_pickup_progress: true
