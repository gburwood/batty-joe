  disposition: Correct the CHG-0013 governance history without rewriting earlier truth. IMP-0013-03.yaml is
    restored verbatim to its content as originally committed at a1d17a6 (outcome blocked, no after/
    completed_at/blocker_resolved fields, source_revision.before as originally recorded). A new implementation
