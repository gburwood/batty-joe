behaviour_summary: >-
  Four independent, additive/corrective gameplay changes, none of which alters the base difficulty speed curve,
  frenzy sub-game physics, or existing paddle-boost behaviour. Item 1 is a complete redesign relative to
  PROP-0013-01, per explicit product-owner rejection of that revision's persistent-boost design; items 2-4 are
  unchanged in substance from PROP-0013-01, with item 2's interpretation now explicitly confirmed rather than
  proposed.


  (1) Brick-rebound "zip" (redesigned, replaces PROP-0013-01 section 1 entirely) - a stateless, one-shot,
  deterministic collision-response effect, not a persistent ball state or second speed-boost system.
  ball.reboundSpeedBoost, accumulated boost percentages, a maximum-boost state, a decay half-life, per-frame
  decay, and any arbitration logic against paddleSpeedBoost - all of PROP-0013-01's rejected design - are
  removed from the proposed design and do not appear anywhere below. The replacement mechanism has two parts:
    (a) A new, pure, stateless function, BJ.Physics.applyBrickReboundZip(ball, targetSpeed, config), called once
    from Game.prototype.handleBallBrickCollisions immediately after a non-penetrating brick's
    BJ.Physics.resolveBallRect call resolves the rebound direction. It sets the ball's velocity magnitude to
    targetSpeed * config.exitSpeedMultiplier, in the direction resolveBallRect already computed, and returns
    that value. Critically, it is computed from targetSpeed (the ball's current, already-established target
    speed for this frame - the same value already threaded through updateBalls today), never from the ball's
    current/incoming speed, so a rapid sequence of consecutive brick bounces always produces the identical fixed
    exit speed and can never compound or ratchet upward across repeated hits. No field is written to the ball
    object by this function; it only sets ball.vx/ball.vy, exactly as every other rebound function already does.
    (b) One guard line added to Game.prototype.updateBalls, immediately before its existing, unmodified call to
    BJ.Physics.decayPaddleSpeedBoost: `if (!ball.paddleSpeedBoost) P.normalizeVelocity(ball, targetSpeed);`.
    This exists solely to guarantee the zip effect cannot linger: BJ.Physics.decayPaddleSpeedBoost (untouched by
    this change) decays *any* current-speed-above-target situation using the paddle system's own configured
    half-life, regardless of cause, because it has no way to tell a paddle-caused boost from any other source of
    elevated speed (see IA-0013-02's structural_finding). Without this guard, a zip-elevated ball would be
    silently absorbed into the paddle system's own decay curve on the very next frame, reproducing exactly the
    "carrying a decaying boost" behaviour the product owner has ruled out - through code this change must not
    modify. The guard is a provable no-op under every existing (non-zip) condition, because ball.paddleSpeedBoost
    is already zero for every ball not currently riding a genuine paddle boost, and such a ball's speed is
    already exactly targetSpeed-consistent by the time this line runs today. It only has an observable effect on
    a ball left zip-elevated by the immediately preceding frame's brick bounce, which it snaps back to standard
    target speed at the very next opportunity - one frame after the bounce, not a decaying window, and before
    decayPaddleSpeedBoost ever inspects it.
    New config block: BJ.Config.physics.brickReboundZip = { enabled: true, exitSpeedMultiplier: <configured,
    e.g. 1.15> }, sibling to (but structurally simpler than, and independent of) the existing
    physics.paddleVelocityTransfer block. Applies uniformly to any non-penetrating brick bounce in ordinary
    play; paddle bounces (bounceFromPaddle/decayPaddleSpeedBoost, untouched) and every frenzy sub-game's own
    physics (pinball restitution, grid runner stepping, etc., all untouched) are unaffected, since
    handleBallBrickCollisions is not part of any frenzy sub-game's update path.


  (2) Regenerating-brick completion lock - unchanged from PROP-0013-01. New Game.prototype.onlyRegeneratingBricksRemain(),
  computing the set of non-indestructible bricks that are either alive or are respawn-mode regenerating bricks
  currently awaiting their respawn delay (the only kind of destroyed brick still "in play"), returning true only
  when that set is non-empty and every member is type 'regenerating'. Game.prototype.updateBricks's existing
  heal/respawn branch and Game.prototype.updateFrenzyRegeneration's existing heal/respawn branch each gate their
  heal and respawn actions on this predicate being false, computed once per call. The product owner has now
  explicitly confirmed this interpretation, including that a destroyed respawn-mode regenerating brick still
  counts as part of the remaining regenerating set (it is not "gone" - it is still in play, awaiting respawn).
  No other behaviour of either function changes.


  (3) Frenzy-timeout auto-completion - unchanged from PROP-0013-01. Game.prototype.finishFrenzyRestore gains one
  trailing call to the existing Game.prototype.checkLevelComplete(), placed after ordinary state restoration,
  state reset to getBasePlayState(), and autosave('frenzy_end'). No new completion predicate is introduced.
  Normal frenzy snapshot restoration is unchanged.


  (4) resolveBallRect() depenetration fix - unchanged from PROP-0013-01. Only the function's final "else"
  (ambiguous-approach) fallback branch is rewritten to snap ball position to the resolved boundary plus a fixed
  small separation epsilon and force outgoing velocity away from that face, matching the style of the four
  single-axis branches above it. Applies generally to every resolveBallRect caller (bricks and boss alike); no
  brick-type-specific branching is added.
