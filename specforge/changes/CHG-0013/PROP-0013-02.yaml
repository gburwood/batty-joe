resolved_ambiguities: >-
  The product owner has resolved both ambiguities this revision exists to address: (1) "more zip off the
  bounce" means option 2 - a non-lingering, immediate-collision-response effect, not a persistent speed boost;
  RISK-0013-06 and PROP-0013-01's behaviour_summary_open_question are resolved by this choice, and the
  brick-type-scope question is resolved as "applies to any non-penetrating brick bounce, regardless of brick
  type" (unchanged from PROP-0013-01's default, which is retained since nothing in the clarification narrowed
  it). (2) The regenerating-brick completion-lock interpretation from IA-0013-01/PROP-0013-01, including
  destroyed respawn-mode bricks counting as "remaining", is confirmed as-is.
