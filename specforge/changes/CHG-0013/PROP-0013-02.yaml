implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved by a human and an
  approval record binds its digest.
- Follow the SpecForge bootstrap, authorization, implementation-attempt, validation and completion lifecycle
  (governance.lifecycle_enforcement set to controlled_v1, as already in effect from CHG-0009) on a dedicated
  branch.
  Do not activate the experimental deterministic governance-tier classifier introduced by CHG-0012.
- BJ.Physics.bounceFromPaddle and BJ.Physics.decayPaddleSpeedBoost's function bodies must not be modified by
  this change. The only change touching the paddle-boost code path is the one new guard line in
  Game.prototype.updateBalls specified above, placed immediately before the existing decayPaddleSpeedBoost call.
- No field named reboundSpeedBoost, or any other new persistent scratch field, may be added to the ball object
  by this change. The zip effect must be fully stateless.
- BJ.Physics.applyBrickReboundZip must compute its exit speed from the targetSpeed parameter passed to it, never
  from the ball's current/incoming speed, so repeated collisions cannot ratchet.
- Game.prototype.onlyRegeneratingBricksRemain (or equivalently named helper) must be shared/reused by both
  updateBricks and updateFrenzyRegeneration rather than reimplemented twice.
- The resolveBallRect() fix must live entirely inside the function's existing ambiguous-approach fallback
  branch; no brick-type-conditional branch may be added anywhere in resolveBallRect(),
  handleBallBrickCollisions, or the boss collision call site.
- batty-joe-dev-spec-v1.13.0.yaml must use the same full_inheritance_with_explicit_change composition pattern as
  batty-joe-dev-spec-v1.12.0.yaml, inheriting it in full and stating only this change's four deltas explicitly.
- specforge/project.yaml's specification.product_specification and specification.current_version must be
  rebound to batty-joe-dev-spec-v1.13.0.yaml / 1.13.0 only as part of the approved implementation attempt, not
  before.
- Implementation-time forensic records must use actual machine time, not invented or staged timestamps (per
  EVT-000107).
- Implementation scope is strictly the four gameplay requirements and their declared artifacts; no unrelated
  repository or bootstrap tidy-up may be bundled into this change (per EVT-000107).
