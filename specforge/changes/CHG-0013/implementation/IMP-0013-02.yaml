approach: >-
  Fix the defect independent review found in IMP-0013-01 (attempt 1, source revision 34e8107, recorded passed
  but observed to never actually move the ball) directly on the same implementation branch
  claude/chg-0013-gameplay-batch. BJ.Physics.applyBrickReboundZip gains a dt parameter and, after resolving
  exitSpeed exactly as before (Math.max(incomingSpeed, targetSpeed*exitSpeedMultiplier) unchanged), performs one
  supplemental position update at that exit velocity (ball.x += ball.vx*dt; ball.y += ball.vy*dt) so the effect
  is genuinely observable within the same frame the bounce occurs. Game.prototype.handleBallBrickCollisions
  gains a dt parameter threaded from Game.prototype.updateBalls, which already has it in scope. Two new
  acceptance tests added: a physics-level test proving the displacement equals exitSpeed*dt directly, and a
  game-level A/B test proving a zip-enabled bounce leaves the ball measurably farther from the brick than an
  otherwise-identical zip-disabled bounce. batty-joe-dev-spec-v1.13.0.yaml's non_regression block corrected from
  gameplay_unchanged/physics_unchanged: true (contradicting the file's own documented changes) to false, with
  itemised gameplay_changes/physics_changes lists. No change to updateBalls's existing step ordering, to
  BJ.Physics.bounceFromPaddle/decayPaddleSpeedBoost's bodies, or to any file outside PROP-0013-04's declared
  scope.
