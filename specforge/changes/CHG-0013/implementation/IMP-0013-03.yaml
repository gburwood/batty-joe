approach: >-
  Fix the double-movement defect independent review found in IMP-0013-02 (attempt 2, recorded blocked pending
  approval, not passed), continuing directly on claude/chg-0013-gameplay-batch.
  BJ.Physics.applyBrickReboundZip's signature (ball, targetSpeed, dt, config) is unchanged; internally it now
  computes bonusSpeed = exitSpeed - incomingSpeed (always >= 0 by construction of
  exitSpeed = Math.max(incomingSpeed, zipSpeed)) and, only when bonusSpeed > 0, applies the supplemental position
  update scaled by bonusSpeed - using the outgoing unit direction (ball.vx/exitSpeed, ball.vy/exitSpeed) - rather
  than the full exitSpeed. Replaced the "moves the ball immediately" test with one asserting the displacement
  equals exactly (exitSpeed - incomingSpeed) * dt, is positive for a below-floor bounce, and is smaller than a
  full target-speed movement step; added a new test proving zero supplemental displacement when the ball is
  already at or above the floor. The existing game-level A/B displacement test, and all zip-floor/no-ratchet/
  paddle-independence/regenerating-brick/frenzy-timeout/resolveBallRect tests, are unchanged and re-verified.
  batty-joe-dev-spec-v1.13.0.yaml's non_regression block (corrected in IMP-0013-02) is left untouched; only the
  physics.brick_rebound_zip.observable_displacement prose is updated to describe the corrected mechanism. No
  change to Game.prototype.updateBalls's step ordering or to any file outside PROP-0013-05's declared scope.
