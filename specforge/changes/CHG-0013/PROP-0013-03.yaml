resolved_review_findings: >-
  Independent review of PROP-0013-02 raised two items, both addressed in this revision. First, a physics
  correctness gap - the unconditional exitSpeed = targetSpeed * exitSpeedMultiplier formula could reduce a
  ball's speed below a legitimate incoming paddle-derived excess, contradicting PROP-0013-02's own stated intent
  and untested by either prior revision; fixed by the Math.max floor formula above, with a new acceptance test
  exercising the previously-untested above-the-floor case. Second, a proposal-exactness gap -
  exitSpeedMultiplier was left as an illustrative placeholder rather than a bound value; fixed by setting the
  initial approved default explicitly to 1.15.
