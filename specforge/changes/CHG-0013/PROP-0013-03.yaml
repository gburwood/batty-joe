behaviour_summary: >-
  Four independent, additive/corrective gameplay changes, none of which alters the base difficulty speed curve,
  frenzy sub-game physics, or existing paddle-boost behaviour. Item 1 carries one physics correction and one
  value-binding relative to PROP-0013-02, found by independent review; items 2-4 are unchanged in substance from
  PROP-0013-01/PROP-0013-02.


  (1) Brick-rebound "zip" (corrected relative to PROP-0013-02) - still a stateless, one-shot, deterministic
  collision-response effect; no ball field, no accumulated boost percentage, no maximum-boost state, no decay
  half-life, no per-frame decay, no arbitration logic against paddleSpeedBoost. Two parts, as in PROP-0013-02,
  with part (a) corrected:
    (a) BJ.Physics.applyBrickReboundZip(ball, targetSpeed, config), called once from
    Game.prototype.handleBallBrickCollisions immediately after a non-penetrating brick's
    BJ.Physics.resolveBallRect call resolves the rebound direction. PROP-0013-02 set the ball's exit speed
    unconditionally to targetSpeed * config.exitSpeedMultiplier, which could reduce a ball's speed below what it
    was already legitimately carrying into the collision (most plausibly a still-decaying paddle-derived
    excess above target, since the existing paddle system's maxBoostPercent, 0.25, can exceed a 1.15 zip
    multiplier). This revision corrects the formula to a floor rather than a replacement:
      zipSpeed = targetSpeed * config.exitSpeedMultiplier
      exitSpeed = Math.max(incomingSpeed, zipSpeed)
    where incomingSpeed is the ball's speed immediately after resolveBallRect resolves direction (incoming
    magnitude, direction now outgoing - unchanged from how applyReboundCharacter already preserves magnitude
    today). normalizeVelocity(ball, exitSpeed) is then applied to that already-resolved outgoing direction. The
    function remains computed fresh from targetSpeed and the ball's current speed on every call - never from any
    stored/remembered value - so a rapid sequence of consecutive brick bounces still cannot ratchet: at most one
    brick collision is resolved per ball per frame, and (per part (b) below) a ball with no active paddle boost
    always enters the next bounce at target-consistent incoming speed, so its exit speed is always exactly
    zipSpeed on every such bounce, never a growing value. A ball that legitimately entered the collision above
    the zip floor now exits at that same, unreduced speed - the zip only ever raises a below-floor incoming
    speed up to the floor, never lowers an above-floor incoming speed down to it.
    (b) One guard line in Game.prototype.updateBalls, immediately before its existing, unmodified call to
    BJ.Physics.decayPaddleSpeedBoost - unchanged from PROP-0013-02:
    `if (!ball.paddleSpeedBoost) P.normalizeVelocity(ball, targetSpeed);`.
    This remains solely responsible for removing zip-only excess speed when no paddle boost is active: it snaps
    a zip-elevated ball (ball.paddleSpeedBoost falsy throughout) back to standard target speed one frame after
    the bounce, before decayPaddleSpeedBoost's own unconditional current-vs-target decay logic (untouched by
    this change) can misidentify the elevated speed as a paddle boost to gradually wind down. When a bounce's
    exit speed instead reflects preserved, genuine paddle-derived excess (ball.paddleSpeedBoost non-zero), the
    guard does not fire, and the existing, unmodified decayPaddleSpeedBoost continues managing that excess from
    the ball's actual current speed exactly as it already does today.
    Config: BJ.Config.physics.brickReboundZip = { enabled: true, exitSpeedMultiplier: 1.15 }, sibling to (but
    structurally simpler than, and independent of) the existing physics.paddleVelocityTransfer block. The
    initial approved default is bound explicitly to 1.15, not left as an illustrative placeholder; it remains an
    ordinary configuration value for later gameplay tuning. Applies uniformly to any non-penetrating brick bounce
    in ordinary play; paddle bounces and every frenzy sub-game's own physics remain untouched and independent,
    unchanged from PROP-0013-02.


  (2) Regenerating-brick completion lock - unchanged from PROP-0013-01/PROP-0013-02. New
  Game.prototype.onlyRegeneratingBricksRemain(), computing the set of non-indestructible bricks that are either
  alive or are respawn-mode regenerating bricks currently awaiting their respawn delay, returning true only when
  that set is non-empty and every member is type 'regenerating'. Game.prototype.updateBricks and
  Game.prototype.updateFrenzyRegeneration each gate their heal/respawn actions on this predicate, computed once
  per call. Confirmed by the product owner, including that a destroyed respawn-mode regenerating brick still
  counts as part of the remaining regenerating set.


  (3) Frenzy-timeout auto-completion - unchanged from PROP-0013-01/PROP-0013-02. Game.prototype.finishFrenzyRestore
  gains one trailing call to the existing Game.prototype.checkLevelComplete(), placed after ordinary state
  restoration. No new completion predicate. Normal frenzy snapshot restoration is unchanged.


  (4) resolveBallRect() depenetration fix - unchanged from PROP-0013-01/PROP-0013-02. Only the function's final
  "else" (ambiguous-approach) fallback branch is rewritten to snap ball position to the resolved boundary plus a
  fixed small separation epsilon and force outgoing velocity away from that face. Applies generally to every
  resolveBallRect caller; no brick-type-specific branching is added.
