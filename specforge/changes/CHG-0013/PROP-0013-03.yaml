acceptance_criteria:
  brick_rebound_zip:
  - A single non-penetrating brick bounce, with incoming speed at or below the zip floor, leaves the ball's
    speed - measured immediately after resolveBallRect/applyBrickReboundZip resolve - equal to
    targetSpeed * config.exitSpeedMultiplier.
  - New for this revision - a ball entering a brick collision already faster than the zip floor (e.g. incoming
    speed set to roughly 1.25 times target, simulating legitimate residual paddle-derived speed, against a
    configured exitSpeedMultiplier of 1.15) exits the bounce at its unchanged incoming speed, not reduced to the
    zip floor and not otherwise altered - the brick bounce never slows an already-faster ball down.
  - New for this revision - calling BJ.Physics.applyBrickReboundZip directly across a range of incoming speeds
    both below and above targetSpeed * exitSpeedMultiplier confirms its return value is exactly
    Math.max(incomingSpeed, targetSpeed * exitSpeedMultiplier) in every case.
  - Calling BJ.Physics.applyBrickReboundZip repeatedly with the same targetSpeed and an incoming speed at or
    below the floor always returns the same exit speed for that targetSpeed (proving it is still computed fresh
    each time and cannot ratchet).
  - Disabling physics.brickReboundZip.enabled leaves brick bounces producing no speed change at all (only the
    existing imperfect-rebound/spin angle effects).
  no_lingering_boost_and_immediate_return:
  - A game-level test drives one brick bounce with incoming speed at or below the zip floor via
    Game.prototype.update(), confirms the ball's speed that frame exceeds target, then advances exactly one
    further simulation frame with no further brick or paddle contact and confirms the ball's speed has already
    returned to the ordinary target-speed-consistent value.
  - The same test inspects ball.paddleSpeedBoost across those frames and confirms it remains 0 throughout.
  no_ratchet_on_repeated_collisions:
  - A test simulates several consecutive brick bounces in immediate succession, each starting from
    target-consistent incoming speed (as the guard guarantees between bounces), and confirms the ball's speed
    after every single bounce is exactly targetSpeed * exitSpeedMultiplier - never higher, and never a
    compounding multiple of it.
  paddle_system_independence:
  - A game-level test drives a brick-zip bounce immediately followed, on a later frame, by a paddle contact, and
    confirms the paddle contact produces exactly the same boostPercent/resulting speed the existing
    "moving paddle temporarily boosts ball speed" test already proves for an unmodified ball.
  - The full existing paddle-boost test block (batty-joe-tests.js:459-520) passes completely unmodified.
  regenerating_brick_completion_lock:
  - In ordinary play, with a level reduced to exactly one alive heal-mode regenerating brick as the only
    non-indestructible brick remaining, advancing time past its configured heal interval after damaging it (but
    not destroying it) leaves its hits unchanged, where the same setup today would heal it.
  - In ordinary play, with a level reduced to exactly one respawn-mode regenerating brick as the only
    non-indestructible brick remaining, destroying it and then advancing time past its configured respawn delay
    leaves it not alive, where the same setup today would respawn it.
  - The same two checks, driven through Game.prototype.updateFrenzyRegeneration instead of updateBricks, hold
    equivalently while a frenzy is active.
  - A control case with at least one surviving normal brick alongside a regenerating brick shows the
    regenerating brick continuing to heal/respawn normally, in both ordinary play and frenzy.
  frenzy_timeout_completion:
  - Entering a frenzy, reducing the level to zero alive non-indestructible bricks, then calling
    exitFrenzy(game, 'timeout') results in game.state === BJ.State.LEVEL_COMPLETE once the transition-out
    completes.
  - The identical setup, but with at least one non-indestructible required brick still alive, results in
    game.state being the base play state (not LEVEL_COMPLETE) once the transition-out completes.
  - The existing "frenzy restores exact held-ball and paddle snapshot" test and the existing "frenzy full clear
    completes level" test both continue to pass unmodified.
  resolve_ball_rect_depenetration:
  - Constructing a ball whose current position fully overlaps a rectangle on more than one axis and calling
    BJ.Physics.resolveBallRect leaves BJ.Physics.circleRect(ball, rect) false immediately afterward.
  - The ball's position after resolution sits outside the rectangle by at least the same small separation
    epsilon already used by the existing single-axis branches.
  - The ball's outgoing velocity component on the resolved axis points away from the rectangle.
  - Repeatedly calling resolveBallRect for several consecutive simulated frames against a static indestructible
    brick, starting from an embedded/overlapping state, converges to zero overlap within a small bounded number
    of calls and does not oscillate.
  - An integration-level test driving Game.prototype.update() for several seconds with a ball placed touching an
    indestructible brick shows the ball's distance from the brick's rectangle increasing away from zero within a
    small number of frames.
  non_regression:
  - No change to Game.prototype.getTargetBallSpeed, BJ.Physics.acceleratedSpeed, BJ.Physics.bounceFromPaddle's
    own boost computation, or BJ.Physics.decayPaddleSpeedBoost's own decay computation (function body untouched).
  - No new field is added to the ball object by this change.
  - No change to any frenzy sub-game's own physics.
  - No change to the four single-axis branches of resolveBallRect().
  - No change to BJ.Levels.countRequired() or its indestructible-exclusion semantics.
  - The full existing batty-joe-tests.js suite passes unmodified, run in full.
  verification:
  - Run the full batty-joe-tests.js suite (via batty-joe-tests.html) and confirm every existing test still
    passes alongside all new tests listed above.
  - SpecForge repository validation (validate-specforge.py) passes.
