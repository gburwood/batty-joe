    - A new game-level test proves that exactly one simulation frame after such a bounce (with no further brick
      contact and no paddle contact), the ball's speed has already returned to the ordinary target-speed-driven
      value - not a value partway through a multi-frame decay curve.
    - A new physics-level or game-level test proves that a rapid sequence of several consecutive brick bounces
      (no intervening frames) never produces a ball speed higher than target * exitSpeedMultiplier - i.e. the
      effect does not ratchet or compound across repeated collisions.
    - A new game-level test proves the paddle-hit boost is completely unaffected - a paddle contact that
      immediately follows a brick-bounce frame still produces exactly the same boostPercent/decay behaviour as
      the existing "moving paddle temporarily boosts ball speed" / "temporary paddle speed boost decays toward
      current target speed" tests already prove, with no interaction from the brick zip mechanism.
    - The full existing batty-joe-tests.js suite, and every acceptance test already listed under IA-0013-01 for
