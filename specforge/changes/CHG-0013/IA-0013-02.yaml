  tests:
    required:
    - Unchanged from IA-0013-01 for items 2-4 (regenerating-brick lock, frenzy-timeout completion,
      resolveBallRect depenetration). See "unchanged_from_ia_0013_01" below.
    - A new physics-level test proves a single non-penetrating brick bounce leaves the ball's speed, measured
      immediately after the collision resolves, higher than the current ordinary target speed by the configured
      exitSpeedMultiplier - i.e. the bounce is measurably more energetic than today's incoming-speed-preserving
