behaviour_summary: >-
  Four independent, additive/corrective gameplay changes, none of which alters the base difficulty speed curve,
  frenzy sub-game physics, or existing paddle-boost behaviour. Item 1 carries one correction relative to
  PROP-0013-03 (observable displacement, not just stored velocity); item 4's own specification text is also
  corrected for an internal contradiction found by review. Items 2-3 and the substance of item 4's mechanism are
  unchanged from PROP-0013-01/PROP-0013-02/PROP-0013-03.


  (1) Brick-rebound "zip" (corrected relative to PROP-0013-03) - still stateless, still a one-shot, deterministic
  collision-response effect; no ball field, no accumulated boost percentage, no maximum-boost state, no decay
  half-life, no per-frame decay, no arbitration logic against paddleSpeedBoost. The exit-speed formula is
  unchanged: zipSpeed = targetSpeed * config.exitSpeedMultiplier; exitSpeed = Math.max(incomingSpeed, zipSpeed).
  What is corrected is what happens to that resolved exit velocity. Independent review of PROP-0013-03's
  implementation found that because Game.prototype.updateBalls integrates ball movement before that same frame's
  collision resolution runs, and the already-approved next-frame guard
  (`if (!ball.paddleSpeedBoost) P.normalizeVelocity(ball, targetSpeed);`) resets stored velocity to target before
  the following frame's movement, a zip-boosted velocity was set and then discarded without ever moving the
  ball - the "sharper, faster rebound" was observable only in a stored-velocity snapshot, never in actual
  gameplay. BJ.Physics.applyBrickReboundZip(ball, targetSpeed, dt, config) now also takes the current frame's dt
  and, immediately after resolving exitSpeed exactly as before, performs one supplemental, synchronous position
  update at that exit velocity - ball.x += ball.vx * dt; ball.y += ball.vy * dt - as part of the same collision
  response, so the effect is genuinely observable within the same frame the bounce occurs. This remains fully
  stateless: the supplemental displacement is computed fresh every call from the current exit velocity and dt,
  never stored, never decayed, and cannot compound across repeated bounces (each bounce's exit velocity is still
  bounded exactly as PROP-0013-03 established, and the resulting one-time position nudge is likewise bounded and
  non-cumulative). The next-frame guard is unchanged and remains solely responsible for returning stored velocity
  to target after a zip-only bounce. Game.prototype.handleBallBrickCollisions also gains a dt parameter (threaded
  from the caller, which already has dt in scope) to pass through to applyBrickReboundZip. Config
  (physics.brickReboundZip = { enabled: true, exitSpeedMultiplier: 1.15 }) is unchanged.


  (2) Regenerating-brick completion lock - unchanged from PROP-0013-01/PROP-0013-02/PROP-0013-03.


  (3) Frenzy-timeout auto-completion - unchanged from PROP-0013-01/PROP-0013-02/PROP-0013-03.


  (4) resolveBallRect() depenetration fix - the code-level mechanism is unchanged from PROP-0013-01/PROP-0013-02/PROP-0013-03.
  What is corrected here is batty-joe-dev-spec-v1.13.0.yaml itself: independent review found its non_regression
  block stated gameplay_unchanged: true and physics_unchanged: true, directly contradicting the same file's own
  documented gameplay and physics changes (brick-rebound zip, regenerating-brick completion lock, frenzy-timeout
  completion, and the resolveBallRect depenetration fix itself). Both fields are corrected to false, with
  itemised gameplay_changes/physics_changes lists cross-referencing the sections that already describe them. The
  other non_regression invariants (scoring_lives_timing_unchanged, persistence_unchanged,
  paddle_velocity_transfer_unchanged, frenzy_subgame_physics_unchanged), which are genuinely still true and were
  already correctly stated, are unchanged.
