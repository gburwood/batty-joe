resolved_review_findings: >-
  Independent review of the CHG-0013 implementation (IMP-0013-01) found two issues, both addressed in this
  revision. First, a physics defect - the zip's boosted exit velocity was set and then discarded before ever
  being used to move the ball, so the effect was never actually observable in gameplay; fixed by having
  applyBrickReboundZip also apply one supplemental, dt-scaled position update at the resolved exit velocity, with
  a new acceptance test measuring actual ball displacement rather than only stored velocity. Second, a
  specification-accuracy gap - batty-joe-dev-spec-v1.13.0.yaml's non_regression block contradicted the change's
  own documented gameplay and physics changes; fixed by correcting gameplay_unchanged/physics_unchanged to false
  with an itemised account of what changed.
