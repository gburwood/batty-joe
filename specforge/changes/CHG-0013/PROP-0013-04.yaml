acceptance_criteria:
  brick_rebound_zip_displacement:
  - A physics-level test proves BJ.Physics.applyBrickReboundZip displaces the ball's position by
    exitSpeed * dt immediately upon return, not merely a stored velocity value, and that this displacement
    exceeds what plain target-speed movement would cover in the same simulation step.
  - A game-level A/B test proves an otherwise-identical brick bounce (same seed, same level, same brick, same
    incoming ball state) leaves the ball measurably farther from the brick with physics.brickReboundZip.enabled
    true than with it false, isolating the effect as a genuine displacement difference rather than one visible
    only in a stored-velocity snapshot.
  brick_rebound_zip_unchanged_properties:
  - All acceptance criteria already established in PROP-0013-03 for the zip floor formula, no-ratchet behaviour,
    non-reduction of an already-faster ball, disabled-config behaviour, and paddle-system independence continue
    to hold and are re-verified against the revised (dt-aware) applyBrickReboundZip signature.
  - The existing "brick bounce zip exceeds target speed then returns to normal on the very next frame" test
    (unchanged) continues to pass, proving the corrected fix still does not leave any lingering stored-velocity
    boost.
  specification_accuracy:
  - batty-joe-dev-spec-v1.13.0.yaml's non_regression block sets gameplay_unchanged and physics_unchanged to
    false, each with an itemised list of the actual changes, cross-referencing the sections of the same file
    that describe them in full.
  - The other non_regression fields (scoring_lives_timing_unchanged, persistence_unchanged,
    paddle_velocity_transfer_unchanged, frenzy_subgame_physics_unchanged) remain true and are unchanged.
  regenerating_brick_completion_lock:
  - Unchanged from PROP-0013-03; all four existing acceptance criteria continue to hold and are re-verified.
  frenzy_timeout_completion:
  - Unchanged from PROP-0013-03; both existing acceptance criteria continue to hold and are re-verified, along
    with the pre-existing frenzy snapshot/full-clear tests.
  resolve_ball_rect_depenetration:
  - Unchanged from PROP-0013-03; all five existing acceptance criteria continue to hold and are re-verified.
  non_regression:
  - No change to Game.prototype.getTargetBallSpeed, BJ.Physics.acceleratedSpeed, BJ.Physics.bounceFromPaddle's
    own boost computation, or BJ.Physics.decayPaddleSpeedBoost's own body (function untouched).
  - No new field is added to the ball object by this change.
  - No change to any frenzy sub-game's own physics, to the four single-axis branches of resolveBallRect(), or to
    BJ.Levels.countRequired().
  - No change to the ordering of Game.prototype.updateBalls's existing steps (decay/guard, spin, magnetism,
    integrateBall, paddle check, brick/boss check) - only handleBallBrickCollisions and applyBrickReboundZip gain
    a dt parameter threaded from values already in scope at their call sites.
  - The full existing batty-joe-tests.js suite passes unmodified, run in full.
  verification:
  - Run the full batty-joe-tests.js suite (via batty-joe-tests.html) and confirm every existing test still
    passes alongside all new/revised tests listed above.
  - SpecForge repository validation (validate-specforge.py) passes.
