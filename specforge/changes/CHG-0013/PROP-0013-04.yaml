implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved by a human and an
  approval record binds its digest, per source-of-truth.md rules 6/8/9. An AI assertion that a human approved a
  proposal is not itself approval evidence.
- BJ.Physics.bounceFromPaddle and BJ.Physics.decayPaddleSpeedBoost's function bodies must not be modified.
- No field named reboundSpeedBoost, or any other new persistent scratch field, may be added to the ball object.
  The zip effect, including its supplemental displacement, must be fully stateless.
- The supplemental position update must be computed from the already-resolved exit velocity and the current
  frame's dt only, applied once per bounce, never stored or re-applied on a later frame.
- Game.prototype.updateBalls's existing step ordering (decay/guard, spin, magnetism, integrateBall, paddle
  check, brick/boss check) must not be reordered or restructured; the fix is confined to
  BJ.Physics.applyBrickReboundZip and the dt parameters threaded to reach it.
- batty-joe-dev-spec-v1.13.0.yaml's non_regression block must not claim an invariant is unchanged when this
  change's own documented sections say otherwise.
- Implementation-time forensic records must use actual machine time, not invented or staged timestamps.
- Implementation scope is strictly this correction and the spec fix; no unrelated repository or bootstrap
  tidy-up may be bundled into this change.
