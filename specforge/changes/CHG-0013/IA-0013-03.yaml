summary: >-
  This revision corrects one physics defect and one non-exactness in PROP-0013-02's zip design, found by
  independent review; nothing else changes. BJ.Physics.applyBrickReboundZip now computes exitSpeed as
  Math.max(incomingSpeed, targetSpeed * exitSpeedMultiplier) instead of unconditionally replacing the ball's
  speed with targetSpeed * exitSpeedMultiplier, so a ball already moving faster than the zip floor (most
  plausibly while carrying legitimate, still-decaying paddle-derived excess speed) is never slowed down by a
  brick bounce. Every stateless/no-ratchet/no-decay/paddle-independence property IA-0013-02 established is
  preserved under the corrected formula, and a new acceptance test exercises the previously-untested
  above-the-floor case directly. Separately, exitSpeedMultiplier is bound to an explicit initial value, 1.15,
  rather than left as an illustrative placeholder. Items 2-4 (regenerating-brick lock, frenzy-timeout completion,
  resolveBallRect depenetration) are unaffected and unchanged from IA-0013-01/IA-0013-02.
