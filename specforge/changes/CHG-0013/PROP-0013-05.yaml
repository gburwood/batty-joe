resolved_review_findings: >-
  Independent review of IMP-0013-02 (PROP-0013-04) confirmed a fresh proposal/approval is the correct governance
  path (not coverage under the existing APR-0014/PROP-0013-03), and found PROP-0013-04's own displacement fix
  defective - it double-advanced the ball with a complete second movement step at the full exit speed, unshielded
  by collision detection, disproportionate to (and in the no-boost case entirely unjustified by) the zip's actual
  effect. Fixed in this revision by scaling the supplemental position update to only the boosted portion of
  speed (bonusSpeed = exitSpeed - incomingSpeed), applied only when that portion is positive. The corrected
  v1.13.0 non_regression specification from PROP-0013-04 is preserved unchanged, per instruction.
