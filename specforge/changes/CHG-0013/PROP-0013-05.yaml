behaviour_summary: >-
  Four independent, additive/corrective gameplay changes, none of which alters the base difficulty speed curve,
  frenzy sub-game physics, or existing paddle-boost behaviour. Item 1 carries one further correction relative to
  PROP-0013-04, confirmed necessary by independent review; items 2-3 and the substance of item 4 are unchanged
  from PROP-0013-01/PROP-0013-02/PROP-0013-03/PROP-0013-04, and item 4's specification-accuracy fix from
  PROP-0013-04 is preserved unchanged.


  (1) Brick-rebound "zip" (corrected relative to PROP-0013-04) - still stateless, still a one-shot, deterministic
  collision-response effect; no ball field, no accumulated boost percentage, no maximum-boost state, no decay
  half-life, no per-frame decay, no arbitration logic against paddleSpeedBoost. The exit-speed formula is
  unchanged: zipSpeed = targetSpeed * config.exitSpeedMultiplier; exitSpeed = Math.max(incomingSpeed, zipSpeed).
  Independent review confirmed PROP-0013-04's own fix for the observable-displacement defect was itself
  defective: it applied a complete extra movement step at the FULL exit speed
  (ball.x += ball.vx*dt; ball.y += ball.vy*dt) on top of the movement the frame's own integrateBall call had
  already performed - a second, unshielded movement step with no further collision detection, disproportionate
  to the boost actually applied. This was visible even in the degenerate no-boost case: a ball already at or
  above the zip floor (exitSpeed === incomingSpeed) still received a full extra exitSpeed*dt of movement, despite
  the zip contributing no boost whatsoever. BJ.Physics.applyBrickReboundZip(ball, targetSpeed, dt, config) is
  unchanged in signature but now computes bonusSpeed = exitSpeed - incomingSpeed (always >= 0) and applies the
  supplemental position update - using the already-normalised outgoing unit direction, scaled by bonusSpeed
  rather than the full exitSpeed - only when bonusSpeed > 0. An already-at-or-above-floor ball now receives zero
  supplemental displacement: the bounce resolves exactly as an ordinary, non-zipped bounce would, with no
  "extra step" of any kind. A below-floor ball receives displacement proportional only to the boost the zip
  itself contributes: (exitSpeed - incomingSpeed) * dt, strictly smaller than a full ordinary movement step at
  target speed. This remains fully stateless (nothing stored on the ball), cannot ratchet (bonusSpeed is
  recomputed fresh, bounded exactly as before, on every call), and does not touch the next-frame guard,
  decayPaddleSpeedBoost, or bounceFromPaddle. Config (physics.brickReboundZip = { enabled: true,
  exitSpeedMultiplier: 1.15 }) is unchanged. Game.prototype.handleBallBrickCollisions's signature is unchanged
  from PROP-0013-04.


  (2) Regenerating-brick completion lock - unchanged from PROP-0013-01/PROP-0013-02/PROP-0013-03/PROP-0013-04.


  (3) Frenzy-timeout auto-completion - unchanged from PROP-0013-01/PROP-0013-02/PROP-0013-03/PROP-0013-04.


  (4) resolveBallRect() depenetration fix and the batty-joe-dev-spec-v1.13.0.yaml non_regression correction -
  both unchanged from PROP-0013-04. The non_regression block's gameplay_unchanged: false / physics_unchanged:
  false with itemised change lists, as corrected in PROP-0013-04, is preserved exactly as-is; only the
  physics.brick_rebound_zip.observable_displacement prose is updated to describe the corrected,
  bonus-only mechanism accurately.
