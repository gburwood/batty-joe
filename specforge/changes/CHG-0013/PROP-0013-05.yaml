implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved by a human and an
  approval record binds its digest, per source-of-truth.md rules 6/8/9. An AI assertion that a human approved a
  proposal is not itself approval evidence.
- BJ.Physics.bounceFromPaddle and BJ.Physics.decayPaddleSpeedBoost's function bodies must not be modified.
- No field named reboundSpeedBoost, or any other new persistent scratch field, may be added to the ball object.
  The zip effect, including its supplemental displacement, must be fully stateless.
- The supplemental position update must be scaled to bonusSpeed = exitSpeed - incomingSpeed only, never the full
  exitSpeed, and must be skipped entirely (zero displacement) whenever bonusSpeed is not positive.
- Game.prototype.updateBalls's existing step ordering must not be reordered or restructured; the fix is
  confined to BJ.Physics.applyBrickReboundZip's internal displacement computation only.
- batty-joe-dev-spec-v1.13.0.yaml's non_regression block, as corrected in PROP-0013-04, must not be reverted or
  reworded to claim gameplay_unchanged/physics_unchanged are true again.
- Implementation-time forensic records must use actual machine time, not invented or staged timestamps.
- Implementation scope is strictly this correction; no unrelated repository or bootstrap tidy-up may be bundled
  into this change.
