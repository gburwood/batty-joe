acceptance_criteria:
  brick_rebound_zip_proportionate_displacement:
  - A physics-level test proves the ball's immediate displacement from a single applyBrickReboundZip call equals
    exactly (exitSpeed - incomingSpeed) * dt, is strictly greater than zero for a below-floor bounce, and is
    strictly smaller than target * dt (an ordinary full movement step) - proving the effect augments the
    existing collision response rather than replaying or doubling it.
  - A physics-level test proves a ball already at or above the zip floor (exitSpeed === incomingSpeed) receives
    exactly zero supplemental x/y displacement - the degenerate no-boost case adds no extra movement step at
    all.
  - The existing game-level A/B displacement test (zip enabled vs disabled, otherwise identical bounce) continues
    to hold - the zip-enabled case still leaves the ball measurably farther from the brick, now by the
    corrected, proportionate margin.
  brick_rebound_zip_unchanged_properties:
  - All acceptance criteria already established in PROP-0013-03/PROP-0013-04 for the zip floor formula,
    no-ratchet behaviour, non-reduction of an already-faster ball, disabled-config behaviour, paddle-system
    independence, and the next-frame return-to-normal behaviour continue to hold and are re-verified.
  specification_accuracy:
  - batty-joe-dev-spec-v1.13.0.yaml's non_regression block continues to state gameplay_unchanged: false and
    physics_unchanged: false with itemised change lists, unchanged from PROP-0013-04.
  - The physics.brick_rebound_zip.observable_displacement prose accurately describes the corrected, bonus-only
    displacement mechanism (no claim of a full extra movement step remains anywhere in the file).
  regenerating_brick_completion_lock:
  - Unchanged from PROP-0013-03/PROP-0013-04; all existing acceptance criteria continue to hold and are
    re-verified.
  frenzy_timeout_completion:
  - Unchanged from PROP-0013-03/PROP-0013-04; all existing acceptance criteria continue to hold and are
    re-verified, along with the pre-existing frenzy snapshot/full-clear tests.
  resolve_ball_rect_depenetration:
  - Unchanged from PROP-0013-03/PROP-0013-04; all existing acceptance criteria continue to hold and are
    re-verified.
  non_regression:
  - No change to Game.prototype.getTargetBallSpeed, BJ.Physics.acceleratedSpeed, BJ.Physics.bounceFromPaddle's
    own boost computation, or BJ.Physics.decayPaddleSpeedBoost's own body (function untouched).
  - No new field is added to the ball object by this change.
  - No change to any frenzy sub-game's own physics, to the four single-axis branches of resolveBallRect(), or
    to BJ.Levels.countRequired().
  - No change to BJ.Physics.applyBrickReboundZip's or Game.prototype.handleBallBrickCollisions's signatures
    (unchanged from PROP-0013-04); only the internal displacement computation changes.
  - No change to the ordering of Game.prototype.updateBalls's existing steps.
  - The full existing batty-joe-tests.js suite passes unmodified, run in full.
  verification:
  - Run the full batty-joe-tests.js suite (via batty-joe-tests.html) and confirm every existing test still
    passes alongside all new/revised tests listed above.
  - SpecForge repository validation (validate-specforge.py) passes once a valid approval authorizes the material
    state.
