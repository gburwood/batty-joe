double_movement_fix:
  defect_confirmed: >-
    Confirmed by re-reading the IMP-0013-02 implementation: after resolving exitSpeed and normalising the ball
    to it, the supplemental step applied `ball.x += ball.vx * dt; ball.y += ball.vy * dt` using the FULL exit
    velocity - i.e. an entire additional movement step at exitSpeed, on top of the movement P.integrateBall
    already performed earlier in the same frame using the ball's pre-collision velocity. This is a complete
    second, unshielded movement step (no further collision detection runs against it), not merely the portion of
    movement attributable to the zip's own boost. The defect is visible even in the no-boost degenerate case:
    when a ball enters a brick bounce already at or above the configured zip floor (exitSpeed === incomingSpeed,
    Risk/finding already anticipated by IA-0013-02's paddle-preservation guarantee), the prior implementation
    still added a full extra exitSpeed * dt of movement, despite the zip having contributed no boost whatsoever
    in that case - there was no principled basis for any additional displacement there at all.
  chosen_fix: >-
    BJ.Physics.applyBrickReboundZip now computes bonusSpeed = exitSpeed - incomingSpeed (always >= 0, by
    construction of exitSpeed = Math.max(incomingSpeed, zipSpeed)) and, only when bonusSpeed > 0, applies the
    supplemental position update scaled to bonusSpeed rather than the full exitSpeed: using the
    already-normalised outgoing unit direction (ball.vx/exitSpeed, ball.vy/exitSpeed), the ball's position
    advances by unit * bonusSpeed * dt. When the ball was already at or above the floor, bonusSpeed is exactly
    zero and no supplemental movement is applied at all - the collision resolves exactly as an ordinary,
    non-zipped bounce would. When the floor does raise the ball's speed, only the incremental distance that
    boosted portion of speed would cover in one dt is added, not a full second step's worth of travel.
  property_preservation: >-
    Every property established across IA-0013-02/03/04 continues to hold: stateless (no ball field), no decay
    curve, no ratcheting (bonusSpeed is recomputed fresh from the current, already-bounded exitSpeed and
    incomingSpeed on every call, never accumulated), paddle-system independence (unchanged - the guard and
    decayPaddleSpeedBoost are untouched), and the "never slows an already-faster ball" guarantee from IA-0013-03
    is now additionally strengthened to "never double-moves an already-faster ball" - such a ball's position is
    touched only by the ordinary resolveBallRect depenetration/direction change, with zero contribution from
    applyBrickReboundZip's supplemental step.
  magnitude_note: >-
    Because the supplemental displacement is now proportional only to the boosted fraction of speed
    (exitSpeedMultiplier - 1, i.e. 0.15 of target at the current default) rather than the full exit speed, its
    absolute magnitude per bounce is correspondingly small (a fraction of a pixel to a few pixels at this game's
    typical speeds and frame budget). This is judged the correct, proportionate calibration given the explicit
    constraint that the effect must be immediate and non-lingering rather than a sustained, multi-frame boost;
    the prior (rejected) full-step version was not "more observable" in a way worth keeping, it was simply
    wrong - it displaced the ball by an amount unrelated to, and in the no-boost case entirely undetermined by,
    the zip's own effect.
