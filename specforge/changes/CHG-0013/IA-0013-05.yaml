summary: >-
  Independent review of IMP-0013-02 (PROP-0013-04) confirmed a fresh proposal/approval is the correct governance
  path for the observable-displacement fix, and found that fix itself defective: it added a complete extra
  movement step at the full exit speed, unshielded by collision detection, even in the case where the zip added
  no boost at all. This revision corrects BJ.Physics.applyBrickReboundZip to scale its supplemental position
  update to only bonusSpeed = exitSpeed - incomingSpeed (zero whenever the ball was already at or above the zip
  floor), so only the movement genuinely attributable to the zip's boost is ever added - never a second full
  step, never any movement at all in the no-boost case. Every previously-established stateless/no-ratchet/
  paddle-independence property continues to hold, now additionally proven not to double-move an already-fast
  ball. batty-joe-dev-spec-v1.13.0.yaml's corrected non_regression block is preserved unchanged. Items 2-4 are
  unaffected.
