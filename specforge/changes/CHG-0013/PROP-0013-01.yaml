behaviour_summary_open_question: >-
  RISK-0013-06 (IA-0013-01) is flagged explicitly for approval, not silently assumed: the default proposed here
  applies the rebound speed boost to any non-penetrating brick bounce regardless of brick type (normal,
  multi_hit, explosive, regenerating, moving, invisible, powerup all qualify equally), matching the literal
  "off the bounce" wording. If the product owner instead wants the boost restricted to certain brick types, that
  should be stated as an approval condition on this revision or returned for a revised proposal.
acceptance_criteria:
  rebound_speed_boost:
  - A single non-penetrating brick bounce measurably raises the ball's speed above the current target speed by
    an amount derived from the configured brickBoostPercent, and BJ.Physics.applyReboundSpeedBoost's return
    value (and ball.reboundSpeedBoost) reflects that exact configured percentage after one hit starting from
    zero.
  - Calling BJ.Physics.decayReboundSpeedBoost repeatedly with increasing elapsed time shows ball.reboundSpeedBoost
    monotonically decreasing toward zero and the ball's speed monotonically decreasing toward the supplied
    target speed, never undershooting it.
  - One configured decayHalfLifeSeconds worth of elapsed time roughly halves the excess-over-target speed,
    mirroring the existing "temporary paddle speed boost decays toward current target speed" test's tolerance
    style (batty-joe-tests.js:502-509).
  - Disabling physics.reboundSpeedBoost.enabled leaves brick bounces producing no speed change at all (only the
    existing imperfect-rebound/spin angle effects), matching the existing "disabled paddle velocity transfer
    restores no-boost behaviour" test's pattern.
  no_unbounded_rebound_accumulation:
  - Calling BJ.Physics.applyReboundSpeedBoost in a tight loop many times in immediate succession (simulating a
    rapid multi-brick sequence with no intervening decay) never produces a ball.reboundSpeedBoost value, or a
    resulting ball speed, exceeding target * (1 + physics.reboundSpeedBoost.maxBoostPercent).
  - A simulated sequence of a paddle hit (setting paddleSpeedBoost near its own maximum) immediately followed by
    a brick bounce (setting reboundSpeedBoost near its own maximum) never produces a ball speed exceeding
    target * (1 + max(paddleVelocityTransfer.maxBoostPercent, reboundSpeedBoost.maxBoostPercent)); it must not
    reach the sum of the two maxima.
  regenerating_brick_completion_lock:
  - In ordinary play, with a level reduced to exactly one alive heal-mode regenerating brick as the only
    non-indestructible brick remaining, advancing time past its configured heal interval after damaging it (but
    not destroying it) leaves its hits unchanged (no heal), where the same setup today would heal it.
  - In ordinary play, with a level reduced to exactly one respawn-mode regenerating brick as the only
    non-indestructible brick remaining, destroying it and then advancing time past its configured respawn delay
    leaves it not alive (no respawn), where the same setup today would respawn it.
  - The same two checks, driven through Game.prototype.updateFrenzyRegeneration instead of updateBricks, hold
    equivalently while a frenzy is active.
  - A control case with at least one surviving normal (non-regenerating, non-indestructible) brick alongside a
    regenerating brick shows the regenerating brick continuing to heal/respawn normally, in both ordinary play
    and frenzy - proving the lock only engages when regenerating bricks are the sole remaining destructible type.
  frenzy_timeout_completion:
  - Entering a frenzy, reducing the level to zero alive non-indestructible bricks by whatever means the active
    frenzy sub-game destroys bricks, then calling exitFrenzy(game, 'timeout') results in game.state ===
    BJ.State.LEVEL_COMPLETE once the transition-out completes.
  - The identical setup, but with at least one non-indestructible required brick still alive when the frenzy
    times out, results in game.state being the base play state (not LEVEL_COMPLETE) once the transition-out
    completes - proving no over-eager completion.
  - The existing "frenzy restores exact held-ball and paddle snapshot" test (batty-joe-tests.js:121-137) and the
    existing "frenzy full clear completes level" test (batty-joe-tests.js:379-385) both continue to pass
    unmodified, proving normal frenzy snapshot restoration and the pre-existing 'clear' completion path are
    unaffected.
  resolve_ball_rect_depenetration:
  - Constructing a ball whose current position fully overlaps a rectangle on more than one axis (so none of
    wasLeft/wasRight/wasAbove/wasBelow is true against a supplied previous position) and calling
    BJ.Physics.resolveBallRect leaves BJ.Physics.circleRect(ball, rect) false immediately afterward (the ball is
    positively separated from the rectangle, not merely velocity-flipped in place).
  - The ball's position after resolution sits outside the rectangle by at least the same small separation
    epsilon already used by the existing single-axis branches, along the axis of minimum penetration.
  - The ball's outgoing velocity component on the resolved axis points away from the rectangle (matching sign
    convention already used by the existing single-axis branches).
  - Repeatedly calling resolveBallRect for several consecutive simulated frames against a static indestructible
    brick, starting from an embedded/overlapping state, converges to zero overlap within a small bounded number
    of calls and does not oscillate (the ball does not re-enter an overlapping state after separating).
  - An integration-level test driving Game.prototype.update() for several seconds with a ball placed touching an
    indestructible brick shows the ball's distance from the brick's rectangle increasing away from zero within a
    small number of frames, rather than remaining pinned at/near zero for the duration of the run.
  non_regression:
  - No change to Game.prototype.getTargetBallSpeed, BJ.Physics.acceleratedSpeed, BJ.Physics.bounceFromPaddle's
    own boost computation, or BJ.Physics.decayPaddleSpeedBoost's own decay computation.
  - No change to any frenzy sub-game's own physics (getPinballRestitution, grid runner stepping, asteroids,
    missile, revenge, fps hitscan/falling-attack logic).
  - No change to the four single-axis branches (wasLeft/wasRight/wasAbove/wasBelow) of resolveBallRect().
  - No change to BJ.Levels.countRequired() or its indestructible-exclusion semantics.
  - The full existing batty-joe-tests.js suite passes unmodified, run in full (not a subset).
  verification:
  - Run the full batty-joe-tests.js suite (via batty-joe-tests.html) and confirm every existing test still
    passes alongside all new tests listed above.
  - SpecForge repository validation (validate-specforge.py) passes.
