implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved by a human and an
  approval record binds its digest (per source-of-truth.md rule 6/9); this session stops after preparing this
  proposal for exactly that reason.
- Follow the SpecForge bootstrap, authorization, implementation-attempt, validation and completion lifecycle
  (governance.lifecycle_enforcement set to controlled_v1, as already in effect from CHG-0009) on a dedicated branch.
  Do not activate or depend on the experimental deterministic governance-tier classifier introduced by CHG-0012
  (specforge/core/policy/governance-tier-policy.yaml, specforge-governance-tier.py) - it is explicitly
  non-authoritative per CHG-0012 and CHG-0013 continues to use ordinary controlled_v1 self-classified review.
- ball.paddleSpeedBoost, BJ.Physics.bounceFromPaddle and BJ.Physics.decayPaddleSpeedBoost must not be renamed,
  restructured, or have their own decay/boost formulas altered by this change.
- The new ball.reboundSpeedBoost field and its increment/decay must each independently enforce their configured
  maximum via clamping at the point of mutation (not merely by convention), so the "no unbounded accumulation"
  acceptance criteria are structurally guaranteed, not just empirically likely.
- Game.prototype.onlyRegeneratingBricksRemain (or equivalently named helper) must be shared/reused by both
  updateBricks and updateFrenzyRegeneration rather than reimplemented twice with potentially divergent
  semantics.
- The resolveBallRect() fix must live entirely inside the function's existing ambiguous-approach fallback
  branch; no new "if brick.type === 'indestructible'" or similar type-conditional branch may be added anywhere
  in resolveBallRect(), handleBallBrickCollisions, or the boss collision call site.
- batty-joe-dev-spec-v1.13.0.yaml must use the same full_inheritance_with_explicit_change composition pattern
  as batty-joe-dev-spec-v1.12.0.yaml, inheriting batty-joe-dev-spec-v1.12.0.yaml in full and stating only this
  change's four deltas explicitly.
- specforge/project.yaml's specification.product_specification and specification.current_version must be
  rebound to batty-joe-dev-spec-v1.13.0.yaml / 1.13.0 only as part of the approved implementation attempt, not
  before.
