behaviour_summary: >-
  Four independent, additive/corrective gameplay changes, none of which alters the base difficulty speed curve,
  frenzy sub-game physics, or existing paddle-boost behaviour.


  (1) Rebound speed boost - new BJ.Physics.applyReboundSpeedBoost(ball, config) and
  BJ.Physics.decayReboundSpeedBoost(ball, dt, targetSpeed, config), mirroring the existing
  bounceFromPaddle/decayPaddleSpeedBoost pair in shape but fully separate in state and bookkeeping. A new ball
  scratch field, ball.reboundSpeedBoost (default 0, reset in createStartingBall and releaseBall exactly like
  ball.paddleSpeedBoost is today), is incremented by a configured percentage on every non-penetrating brick
  bounce in Game.prototype.handleBallBrickCollisions, capped every time at a configured maximum
  (Math.min(config.maxBoostPercent, current + config.brickBoostPercent)), and decays every frame in
  Game.prototype.updateBalls (alongside the existing decayPaddleSpeedBoost call) toward the normal target speed
  with a configured half-life. New config block: BJ.Config.physics.reboundSpeedBoost = { enabled, brickBoostPercent,
  maxBoostPercent, decayHalfLifeSeconds }, sibling to the existing physics.paddleVelocityTransfer block.
  decayReboundSpeedBoost only ever raises the ball's realised speed to meet its own decaying ceiling
  (target * (1 + ball.reboundSpeedBoost)); it never lowers speed, so it cannot undo or race against an
  in-progress paddle-boost decay in the same frame. The realised ball speed on any frame is therefore bounded by
  target * (1 + max(paddleVelocityTransfer.maxBoostPercent, reboundSpeedBoost.maxBoostPercent)), never the sum of
  the two. Applies uniformly to any non-penetrating brick bounce in ordinary play; paddle bounces and every
  frenzy sub-game's own physics (pinball restitution, grid runner, etc.) are untouched.


  (2) Regenerating-brick completion lock - new Game.prototype.onlyRegeneratingBricksRemain(), computing the set
  of non-indestructible bricks that are either alive or are respawn-mode regenerating bricks currently awaiting
  their respawn delay (the only kind of destroyed brick still "in play"), and returning true only when that set
  is non-empty and every member is type 'regenerating'. Game.prototype.updateBricks's existing heal/respawn
  branch (batty-joe-game.js:608-618) and Game.prototype.updateFrenzyRegeneration's existing heal/respawn branch
  (batty-joe-game.js:1762-1770) each gate their heal and respawn actions on this predicate being false, computed
  once per call. No other behaviour of either function changes; moving bricks, indestructible bricks and every
  other brick type's destruction are unaffected.


  (3) Frenzy-timeout auto-completion - Game.prototype.finishFrenzyRestore gains one trailing call to the
  existing Game.prototype.checkLevelComplete(), placed after ordinary paddle/ball/powerup state has been
  restored (or freshly created), state has been set back to getBasePlayState(), and autosave('frenzy_end') has
  run - i.e. exactly where the normal per-brick-destruction call site (damageBrick) would have fired had the
  level still had a required brick to destroy. checkLevelComplete() and completeLevel() are otherwise completely
  unmodified: it still refuses to act while isFrenzyState() is true (already false by this point in
  finishFrenzyRestore) or while a boss is present, and still reuses BJ.Levels.countRequired()'s existing
  indestructible-exclusion. No new completion predicate, frenzy-specific or otherwise, is introduced. Normal
  frenzy snapshot restoration (balls/paddle/powerups/RNG/combo/finalAssault/bigBomb) in finishFrenzyRestore is
  unchanged.


  (4) resolveBallRect() depenetration fix - only the function's final "else" (ambiguous-approach) branch in
  BJ.Physics.resolveBallRect (batty-joe-physics.js:147-158) is rewritten. It still computes the minimum-
  penetration axis/side exactly as today, but instead of only flipping the corresponding velocity component, it
  now also snaps the ball's position to that side's rectangle boundary plus a fixed small separation epsilon
  (matching the existing 0.01px epsilon already used by the four single-axis branches immediately above it in
  the same function) and forces the outgoing velocity component away from the resolved face via Math.abs(),
  exactly matching the style of those four branches. The four single-axis branches (wasLeft/wasRight/wasAbove/
  wasBelow) are unchanged. This is a change to resolveBallRect() itself, so it applies uniformly to every caller
  - ordinary brick collisions and boss collisions alike - with no brick-type-specific or boss-specific branching
  added anywhere.
