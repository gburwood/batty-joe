  - specforge-dist/0.1.0-alpha.10/core/tools/__pycache__/specforge_authority.cpython-314.pyc
  - specforge-dist/0.1.0-alpha.10/core/tools/__pycache__/specforge_project.cpython-314.pyc
implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved and an approval
  record binds its digest.
- Follow the SpecForge bootstrap, authorization, implementation-attempt, validation and completion lifecycle on
  a dedicated branch, kept separate from product development.
- Do not modify any product source file, any other test harness, or any file under specforge/core/ or
  specforge/packs/.
- Do not alter the original adoption-time baseline_artifact_hashes values recorded in
  specforge/changes/CHG-0001/PROP-0001-01.yaml; only tests/run-adoption-tests.py's live check against them
  changes.
- Allocate new forensic event IDs sequentially from the current repository tip at implementation time; do not
  reuse or pre-reserve specific EVT-* numbers from this proposal.
