approach: Replaced the single hardcoded level-20 boss config with a per-level boss config map (C.bosses, keyed by
  campaign level) and a C.bossLevels array; rewrote boss generation, state transitions, phase/attack logic, rendering
  and the debug boss-jump cheat to look up the active level's boss config instead of a single fixed config; added the
  three new milestone bosses (level 5 THE WARM-UP, level 10 THE ENFORCER, level 15 THE LAST WARNING) with the stats
  approved in PROP-0006-01; left the level 20 boss's stats, phases and taunts unchanged; added regression coverage for
  the new bosses and for the constraint that only the level 20 boss defeat triggers VICTORY; produced
  batty-joe-dev-spec-v1.9.0.yaml documenting the change.
