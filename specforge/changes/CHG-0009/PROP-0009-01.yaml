implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved and an approval record binds its digest.
- Follow the SpecForge bootstrap, authorization, implementation-attempt, validation and completion lifecycle on this branch.
- Limit runtime edits to batty-joe.html and batty-joe.js; do not modify batty-joe-game.js.
- Read live values from the existing Game instance inside App.onStateChange when next equals BattyJoe.State.PAUSED.
- Reuse BattyJoe.Utils.formatScore; do not add a second score-formatting rule.
- Do not include cleanup of the two pre-existing stale legacy test harnesses in this change.
- Copilot must not widen the feature or edit main directly; implementation remains on copilot/chg-0009-pause-status for review.
