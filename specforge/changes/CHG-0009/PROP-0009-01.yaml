behaviour_summary: When Batty Joe enters the PAUSED state, the pause panel displays the current campaign level, score and remaining lives alongside the existing campaign seed. The values are refreshed from authoritative game state each time the panel opens.
requirement_changes:
  add: []
  modify: []
  deprecate: []
  supersede: []
acceptance_criteria:
  pause_status:
  - The pause panel visibly labels and displays LEVEL, SCORE and LIVES in addition to SEED.
  - LEVEL equals Game.level at the moment the application enters PAUSED.
  - SCORE equals Game.score formatted with BattyJoe.Utils.formatScore.
  - LIVES equals Game.lives at the moment the application enters PAUSED.
  - All four pause-panel values refresh on every transition into PAUSED; no copied or cached campaign state is introduced.
  non_regression:
  - Game.pause and Game.resume are not modified.
  - Keyboard and button controls, including Escape and RESUME, remain unchanged.
  - Restart Level, Settings and Quit to Menu behaviour remain unchanged.
  - Physics, scoring, lives, timing, autosave and campaign progression behaviour remain unchanged.
  verification:
  - A focused Node regression test proves the DOM projection for representative level, score and lives values and proves score formatting is reused.
  - Current CHG-0004, CHG-0005 and physics regression suites pass.
  - SpecForge repository validation passes.
