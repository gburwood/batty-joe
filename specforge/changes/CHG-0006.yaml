request:
  summary: Add campaign boss encounters at levels 5, 10 and 15, escalating toward the existing level 20 finale.
  detail: The user asked the AI to take on the combined role of game designer and coder, review the game as it stands, and
    propose either an improvement or a new feature. The AI reviewed the authoritative v1.8.0 specification and the current
    implementation, and found that the specification already declares this exact intent without it being built
    (bosses.milestone_support.future_levels lists [5, 10, 15, 20], and future_architecture.additional_bosses is marked
    planned_possible, but only the level 20 boss exists in code). The AI proposed closing that gap with three new,
    progressively tougher boss encounters that build toward the existing finale rather than matching it. The user asked
    for this to be formalised as a Change.
clarification:
  required: false
  notes: The three new bosses' exact health, speed, fire-interval and phase values are the AI's design proposal rather than
    values dictated by an existing unambiguous requirement. PROP-0006-01 states them explicitly for approval.
