implementation_constraints:
- Implementation must not begin until this exact proposal revision is explicitly approved and an approval
  record binds its digest.
- Follow the SpecForge bootstrap, authorization, implementation-attempt, validation and completion lifecycle on
  a dedicated branch.
- Limit edits to tests/run-chg0005-tests.js only; do not modify batty-joe-game.js, batty-joe-config.js, any
  other product file, or any other test harness.
- Normalize only the in-memory read of source content immediately after fs.readFileSync (e.g. translate CRLF to
  LF before matching); do not alter any expected string or regex literal to work around the defect by weakening
  the check.
- Before recording the implementation as passed, verify the harness still fails against a deliberately reverted
  collision exit call, so the fix is proven not to make the regression guard vacuous.
- Allocate new forensic event IDs sequentially from the current repository tip at implementation time; do not
  reuse or pre-reserve specific EVT-* numbers from this proposal.
