id: PROP-0007-01
change: CHG-0007
revision: 1
status: superseded
created_at: '2026-09-09T14:15:00+01:00'
based_on_impact_analysis:
- IA-0007-01
proposed_specification_version: 1.10.0
behaviour_summary: Introduce an optional handcrafted level system allowing both designers to commit levels to the specification and players to create custom levels in-browser. Designer levels replace procedural generation when present; player-created levels are stored in localStorage (max 20) and are fully exportable/importable as JSON. All handcrafted levels use a 12×10 grid with 16-96 bricks, max durability 5, and optional power-up spawners. System gracefully falls back to procedural generation if any handcrafted level is missing or corrupt. No changes to physics, frenzy, boss encounters, or scoring.
architecture:
  grid_system:
    dimensions: {cols: 12, rows: 10, total_slots: 120}
    brick_constraints: {min_per_level: 16, max_per_level: 96, max_durability: 5}
    powerup_types_supported:
    - multi_ball
    - laser
    - slow_time
    - paddle_expansion
    - frenzy_pickup
  level_storage:
    designer_levels:
      storage_location: batty-joe-levels-handcrafted.yaml
      versioning: Per-specification version
    player_levels:
      storage_location: window.localStorage
      key_format: BattyJoe_UserLevel_{levelId}
      index_key: BattyJoe_UserLevelIndex
      capacity: 20
  level_editor_ui:
    capabilities:
    - Visual 12×10 grid for brick placement
    - Brick palette and durability controls
    - Test-play
    - Save/load/delete
    - JSON export/import
  integration_with_campaign:
    level_loading_logic:
    - Check designer handcrafted level for campaign slot.
    - If valid, load it.
    - Otherwise fall back to procedural generation.
  test_play_integration:
    mechanics:
    - Test-play uses normal game physics and rendering.
    - Frenzy system remains active.
requirement_changes:
  add:
  - Requirement: Game must support loading handcrafted levels from batty-joe-levels-handcrafted.yaml
  - Requirement: Game must validate handcrafted levels against handcrafted-level.schema.json
  - Requirement: Player levels must persist across browser sessions via localStorage
  - Requirement: Player must be able to export any level as JSON and reimport it to recreate exact state
  - Requirement: Grid editor must enforce 16-96 brick count and max durability 5
  - Requirement: If a handcrafted level is missing or corrupt, game must fall back to procedural for that campaign slot
  modify: []
  deprecate: []
  supersede: []
specification_changes:
- Introduce v1.10.0 of batty-joe-dev-spec-v1.10.0.yaml
- Add handcrafted level system to product intent.
- Mark future_architecture.handcrafted_levels as implemented.
artifacts_expected:
  add:
  - batty-joe-level-editor.js
  - batty-joe-handcrafted-levels-loader.js
  - batty-joe-levels-handcrafted.yaml
  - schemas/handcrafted-level.schema.json
  - batty-joe-dev-spec-v1.10.0.yaml
  modify:
  - batty-joe-levels.js
  - batty-joe-game.js
  - batty-joe.html
  - batty-joe.css
  - batty-joe-tests.js
implementation_constraints:
- Do not modify physics, frenzy, boss, or scoring systems
- Do not break existing procedural level generation; it must remain as fallback
- Validate handcrafted levels before loading
- Grid must enforce 12×10 dimensions
- localStorage errors must not crash game
- JSON import must validate before loading into grid
