behaviour_summary: Add a 12 by 10 level editor for player-authored levels and optional designer-authored campaign levels. Player levels persist in localStorage, may be imported/exported, and can be selected and drag-and-drop ordered into a Custom Campaign of up to 20 levels. Custom levels play in the selected order, then normal campaign play resumes at level n plus one. New Game runs the normal campaign using designer levels where available, with procedural generation as fallback. Each handcrafted level contains 16-96 bricks, durability 1-5, and at most two frenzy power-ups.
implementation_constraints:
- Preserve procedural generation as the fallback for unavailable designer levels.
- Do not modify physics, scoring, boss, or normal Frenzy game behavior.
- Validate player-authored data before persistence, import, or play.
- Keep custom campaigns separate from normal campaign progress until their selected levels are complete.
