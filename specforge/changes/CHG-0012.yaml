request:
  summary: Create a read-only experimental classifier that retrospectively classifies CHG-0001 through CHG-0011 from their actual material diffs using deterministic policy rules.
  detail: >-
    The experiment tests the architectural hypothesis that SpecForge can assign a minimum governance tier mechanically rather than allowing an implementing AI to self-classify risk. It must remain non-authoritative: it may inspect historical implementation source revisions, material diffs and a declarative policy, but it must not alter lifecycle decisions, authorization, completion gates, product behaviour or current trusted authority.
clarification:
  required: false
  notes: >-
    Scope is intentionally an experiment against existing Batty Joe history before any SpecForge Core architecture change is proposed. The classifier must fail upward on unmatched material paths and fail closed when it cannot establish a trustworthy classification. The first approved implementation attempt was blocked after independent exploratory evidence exposed a policy mismatch requiring PROP-0012-02.
