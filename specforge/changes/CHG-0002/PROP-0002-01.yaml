  - batty-joe-tests.js
  add: []
implementation_constraints:
- Do not change the established spin formula except where required to separate spin
  from speed transfer.
- Do not allow the new boost to permanently raise the normal target ball speed.
- Use deterministic calculations only.
- Centralise tuning values in BattyJoe.Config and expose them through the existing
  config override pattern.
- Implement the approved specification first; code must not silently become the source
  of product intent.
