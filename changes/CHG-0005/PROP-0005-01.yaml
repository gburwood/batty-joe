implementation_constraints:
- Do not change Grid Runner controls, speed, layout, scoring, duration or collision rules.
- Do not change the authoritative v1.8.0 specification because it already defines the intended termination behaviour.
- Preserve shared Frenzy transition-out and restoration behaviour.
- Preserve debug invulnerability semantics.
- Add focused regression tests for all Grid Runner termination paths.
