behaviour_summary: Restore the Grid Runner termination behaviour already defined by Batty Joe v1.8.0 by implementing the missing collision handler and protecting the animation loop from the current TypeError.
implementation:
  collision_handler:
    name: onFrenzyPlayerHit
    semantics:
    - If debug invulnerability is active, do not begin the collision exit.
    - Otherwise begin the shared Frenzy exit with reason collision.
    - Return whether an exit was initiated so callers have explicit outcome information.
  grid_runner:
    boundary_collision: invoke the defined collision handler and terminate the current Grid Runner update
    trail_collision: invoke the defined collision handler and terminate the current Grid Runner update
    blocker_collision: invoke the defined collision handler and terminate the current Grid Runner update
  timeout:
    configured_seconds: 20
    behaviour: unchanged
