request:
  summary: Paddle contact should impart temporary ball velocity as well as spin.
  detail: When the bat strikes a ball, the resulting ball motion should depend on
    where the ball contacts the bat and how quickly the bat is moving. The existing
    spin model remains, but paddle contact should also produce a temporary increase
    in ball speed/velocity rather than normalising immediately back to the pre-contact
    speed.
