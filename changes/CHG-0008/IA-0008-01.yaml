  tests:
    required:
    - Existing pre-CHG-0007 regression suite passes after restoration.
    - Normal campaign levels load through the pre-CHG-0007 generation path.
    - CHG-0006 boss milestones at levels 5, 10, 15 and 20 remain present and unchanged.
    - No level-editor or Custom Campaign UI remains reachable from the active game.
    - Active runtime files contain no dependency on CHG-0007-only modules or global state.
    - SpecForge manifest points to v1.11.0 and repository validation passes.
compatibility:
  breaking: true
  notes: >
    Player-created custom levels and Custom Campaign UI introduced by CHG-0007 are no
    longer available. Existing localStorage entries may remain inert in the browser;
    the rollback does not delete browser data automatically.
migration:
  required: true
  notes: >
    The authoritative product specification advances to 1.11.0 rather than moving
    backwards to 1.9.0. Version 1.11.0 explicitly withdraws CHG-0007 behaviour and
    restores the 1.9.0 gameplay contract while retaining v1.10.0 as historical evidence.
risks:
- id: RISK-0008-01
  description: >
    A blunt git reset or revert of repository history would erase or obscure evidence
    needed to understand why CHG-0007 failed.
  severity: high
  mitigation: >
    Perform a forward rollback and preserve CHG-0007 governance and forensic records.
- id: RISK-0008-02
  description: >
    Restoring complete files could accidentally undo CHG-0006 behaviour if the rollback
    source predates CHG-0006.
  severity: high
  mitigation: >
    Use f901c9b7532b522309bcaecdf76f0db41d7429bc, which is immediately before CHG-0007
    and already includes the completed CHG-0006 source revision.
- id: RISK-0008-03
  description: >
    Leaving REQ-0007 and REQ-0008 active after runtime rollback would make the
    specification and implementation inconsistent.
  severity: high
  mitigation: >
    Withdraw both requirements under CHG-0008 and record the withdrawal in v1.11.0.
- id: RISK-0008-04
  description: >
    CHG-0007-created localStorage data may survive the rollback and confuse a future
    redesigned editor.
  severity: low
  mitigation: >
    Leave browser data untouched and handle any cleanup only through a future approved change.
open_changes:
  overlaps_with: []
summary: >
  CHG-0007 is being backed out as a forward corrective change. Its lifecycle evidence
  was internally inconsistent, mandatory validation was unavailable despite completion,
  and product inspection found implementation/specification mismatches. The rollback
  restores the seven modified runtime/test files from f901c9b7532b522309bcaecdf76f0db41d7429bc,
  removes CHG-0007-only runtime artifacts, retains the historical evidence, withdraws
  REQ-0007 and REQ-0008 and publishes v1.11.0 as the authoritative specification.
