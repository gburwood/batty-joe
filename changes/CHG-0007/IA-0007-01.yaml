summary: >
  Historical CHG-0007 analysis described two parallel handcrafted-level workflows:
  designer-committed campaign levels and player-created browser levels. Both used a
  shared 12 by 10 grid model with validation and procedural fallback.
compatibility:
  breaking: false
  notes: >
    The original analysis characterised the feature as additive and expected existing
    campaigns to continue procedurally when handcrafted data was unavailable.
migration:
  required: false
  notes: >
    Player-created levels were intended to live in browser localStorage. Designer
    levels were intended to be Git-committed specification artifacts.
risks:
- id: RISK-0007-01
  description: >
    Browser localStorage behaviour and capacity vary by browser and could make saved
    player levels unavailable.
  severity: medium
  mitigation: >
    The original analysis proposed graceful errors and JSON export/import.
- id: RISK-0007-02
  description: >
    Imported JSON could contain invalid or unsupported level data.
  severity: medium
  mitigation: >
    The original analysis required validation before import or play.
- id: RISK-0007-03
  description: >
    Handcrafted-level integration could interfere with existing campaign, boss,
    frenzy or power-up behaviour.
  severity: high
  mitigation: >
    The original analysis required procedural fallback and regression testing.
open_changes:
  overlaps_with: []
historical_analysis:
  level_loading_sequence:
  - Check for a designer handcrafted definition for the current campaign level.
  - Validate and load it when available.
  - Fall back to existing procedural generation when unavailable or invalid.
  - Keep player-created levels separately in browser localStorage.
  player_level_capacity: 20
  grid:
    columns: 12
    rows: 10
    minimum_bricks: 16
    maximum_bricks: 96
    maximum_durability: 5
  intended_ui:
  - Level Editor menu entry
  - Grid editor and palette
  - Save, load and delete
  - JSON export and import
  - Test play
  - Ordered Custom Campaign
extensions:
  forensic_correction:
    corrected_by_change: CHG-0008
    original_blob_sha: e7c9ff551d096ed5830882f8004344e50c2a0279
    previous_correction_blob_sha: b032edb145ae3eb0c6258b247cd033a3202dd59c
    reason: >
      The historical file contained invalid YAML where fallback scenario scalar values
      were followed by nested action mappings. This canonical summary preserves the
      historical conclusions while making the record parseable and schema-valid.
    original_history_preserved_in_git: true
